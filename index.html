    });
  }

  /* ---------------- rules (worked out from the live settings) ---------------- */
  function renderRules() {
    var cfg = S.cfg, gaps = [3, 10, 20, 40, 60];
    var rows = gaps.map(function (g) {
      var pf = chanceOf(0, g, cfg.spread), pd = chanceOf(g, 0, cfg.spread);
      return "<tr><td>" + g + ' places apart</td><td class="num">' + fmtPts(Math.min(1 / pf, cfg.cap)) + " (" + Math.round(pf * 100) + '%)</td><td class="num">' +
        fmtPts(Math.min(1 / pd, cfg.cap)) + " (" + Math.round(pd * 100) + "%)</td></tr>";
    }).join("");
    var mrows = S.rounds.map(function (r) {
      return "<tr><td>" + esc(r.name) + '</td><td class="num">\u00d7' + r.mult + '</td><td class="num">' + Math.round(cfg.cap * r.mult) + "</td></tr>";
    }).join("");
    var RL = S.rounds;
    // Round multipliers, explained with this season's own numbers.
    var seenMult = {}, multEx = [];
    RL.forEach(function (r) {
      if (!(r.mult > 1) || seenMult[r.mult]) return;
      seenMult[r.mult] = 1;
      var v = 4 * r.mult;
      multEx.push("<b>" + (Number.isInteger(v) ? v : v.toFixed(1)) + "</b> in " + (/^Round/.test(r.name) ? "" : "the ") + esc(r.name) + " (\u00d7" + r.mult + ")");
    });
    var multText = multEx.length
      ? "<p>Later rounds are worth more. Every correct prediction in a round has its points multiplied by that round\u2019s multiplier, shown in the table below.</p>" +
        "<p>For example, a prediction worth <b>4</b> points in a \u00d71 round scores " + multEx.join(" and ") + ".</p>" +
        "<p>The pick screen already shows the multiplied points, so there\u2019s nothing to work out.</p>" +
        "<p>The limit of " + cfg.cap + " points on a single pick is applied before the multiplier, so the most one pick can pay also goes up in the later rounds:</p>"
      : "<p>Every round is worth the same this season, so there are no multipliers to worry about.</p>";
    var shareBar = RULES_ONLY
      ? '<div class="btnrow" style="margin:18px 0 0"><a class="btn small" style="text-decoration:none;text-align:center" href="' + esc(pageLink(false)) + '">Sign in or join to play</a></div>'
      : '<div class="btnrow" style="margin:18px 0 0;align-items:center"><button type="button" class="btn small secondary" id="rulesCopy">Copy a link to these rules</button><span class="spstate" id="rulesCopied" role="status"></span></div>';
    $("rulesView").innerHTML = shareBar +
      '<div class="panel" style="margin-top:18px"><div class="phead"><h2>How it works</h2><span class="hint">Every tie \u00b7 max ' + cfg.maxUses + ' uses per team</span></div><div class="rulesbody">' +
      "<h3>The basics</h3>" +
      "<p>Every round, you predict <b>every tie</b>: pick which team goes through. A correct prediction scores points, a wrong prediction scores <b>0</b>. There are no lives and nobody is eliminated. Most points after the Final wins.</p>" +
      "<p>You need to <b>join before Round 3 locks</b>. Nobody can join the game after that.</p>" +
      "<p>The one big rule: you can back any one team a <b>maximum of " + cfg.maxUses + " times</b> across the whole Cup. Spend them wisely.</p>" +
      "<h3>How points are worked out</h3>" +
      "<p>Every club is ranked by where it sits in the English pyramid: Premier League 1st to 20th, then the Championship, League One and League Two. Positions are taken from the league tables when each round opens, and don\u2019t change after that, even if the tables move before the games are played. Every club below League Two counts as <b>93rd</b>, so two non-league sides meeting each other is a coin flip.</p>" +
      "<p>Each team gets a <b>chance of going through</b>, shown as a percentage under its name on the pick screen. It comes from one thing only: how far apart the two clubs are in that ranking. Level clubs are 50/50, and the bigger the gap, the surer the higher-ranked club is.</p>" +
      "<p><b>The lower a team\u2019s chance, the more it pays.</b> To see what a correct pick scores, divide 100 by the percentage:</p>" +
      '<ul class="ruleslist"><li>98% chance (a big favourite): about <b>1</b> point</li><li>50% chance (a coin flip): about <b>2</b> points</li>' +
      "<li>25% chance (1 in 4): about <b>4</b> points</li><li>10% chance (1 in 10): about <b>10</b> points</li></ul>" +
      "<p>The pick screen already shows the points, so you never have to work it out yourself. No pick can pay more than <b>" + cfg.cap + "</b> before the round multiplier.</p>" +
      '<table class="rulestable"><tr><th></th><th class="num">Favourite</th><th class="num">Underdog</th></tr>' + rows + "</table>" +
      '<p class="note">Each cell shows the points, then the chance in brackets.</p>' +
      "<p>These chances are a simple estimate from league positions, not bookmakers\u2019 odds, so they can be wrong. Spotting a tie where the real chance is better than the estimate is where the skill is.</p>" +
      '<p class="note">The points are locked when the round opens, so what you see on the pick screen is what you get if you\u2019re right.</p>' +
      "<h3>Round multipliers</h3>" + multText +
      '<table class="rulestable"><tr><th></th><th class="num">Multiplier</th><th class="num">Most a pick can pay</th></tr>' + mrows + "</table>" +
      '<h3>Team limits <span class="rulestag">' + cfg.maxUses + " per team</span></h3>" +
      "<p>You can back any one team a <b>maximum of " + cfg.maxUses + " times</b> across the whole Cup. A pick counts as a use when the round locks, whether or not the team goes through. Once a team is used up it\u2019s banned for you, although other managers can still pick it.</p>" +
      '<ul class="ruleslist"><li>If one team in a tie is used up, you have to back the other.</li><li>If <b>both</b> teams in a tie are used up, there\u2019s no pick and that tie scores 0.</li></ul>' +
      ("<h3>Season picks</h3>" +
        (cfg.specials ? "" : '<p class="note">Season picks are switched off for the current season, so this section doesn\u2019t apply to it.</p>') +
        "<p>Before Round 3 locks, you also make two picks that last the whole Cup. They can\u2019t be changed once Round 3 locks, and other managers can\u2019t see them until then.</p>" +
        '<ul class="ruleslist"><li><b>Cup Winner:</b> name the club you think will win the Cup. If it does, you get its bonus. The bonus runs from <b>+3</b> for the league leaders up to <b>+30</b> for a long shot.</li>' +
        "<li><b>Dark Horse:</b> name one club from outside the Premier League. You get its bonus <b>every time it wins a round</b>, from <b>+1</b> a round for the top of the Championship up to <b>+4</b> a round for a non-league side.</li></ul>" +
        '<p class="note">Each club\u2019s bonus is shown next to its name when you choose, and it is fixed from the league positions on the day Round 3 opens. These picks don\u2019t count towards your ' + cfg.maxUses + " uses of a team, and a pick left blank simply earns nothing.</p>") +
      "<h3>Extra time, penalties and replays</h3><p>A team counts as going through if it wins the tie by any route: in normal time, extra time, on penalties, or in a replay if one is played. Only who progresses matters, never the score.</p>" +
      "<h3>Missed picks</h3><p>If you haven\u2019t predicted a tie before the round locks, it\u2019s auto-assigned to the <b>higher-ranked team</b>, and it uses up one of that team\u2019s picks like any other prediction. It scores exactly as if you\u2019d chosen it.</p>" +
      '<ul class="ruleslist"><li>If the higher-ranked team is used up, the other team is picked instead.</li><li>If both teams are used up, the tie scores 0.</li><li>If the two clubs are ranked the same (two non-league sides), the home team is picked.</li></ul>' +
      "<h3>Final tiebreak</h3><p>If managers are level on points after the Final, it\u2019s settled in this order:</p>" +
      '<ol class="ruleslist"><li>Most correct predictions.</li><li>Biggest gap: the most league places between the two clubs in a tie where you backed the lower-placed club and it went through.</li><li>Still tied? The prize is shared. <span class="quip">(Cue the admin: \u201cGoddamit, this is costing me a fortune in shields!\u201d)</span></li></ol>' +
      "</div></div>";
  }

  /* ---------------- tabs ---------------- */
  /* ---------------- stats ---------------- */
  // Everything here is worked out in the browser from what the game already publishes once a round locks:
  // everyone's picks for that round, the results, and the leaderboard. Nothing about an open round is shown.
  var ST = { data: null, round: null, focus: "", a: "", b: "" };
  var ST_COL = { fav: "#3987e5", dog: "#199e70", cup: "#c98500", dark: "#9c6ade" };   // checked for colour-blind separation on the panel colour
  function ord(n) { var s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
  function pct(a, b) { return b ? Math.round(100 * a / b) + "%" : "-"; }
  function stName(n) { return esc(n) + (S.who && n === S.who.name ? ' <span class="st-you">you</span>' : ""); }
  function stMe(n) { return S.who && n === S.who.name ? ' class="me"' : ""; }

  function loadStats() {
    var locked = S.rounds.filter(function (r) { return r.status === "locked" || r.status === "resolved"; });
    return Promise.all([
      Promise.all(locked.map(function (r) { return db.get("kamikaze_fa_public/seasons/" + S.sid + "/rounds/" + r.id).catch(function () { return null; }); })),
      db.get("kamikaze_fa_public/seasons/" + S.sid + "/leaderboard").catch(function () { return null; })
    ]).then(function (x) { return buildStats(locked, x[0], x[1]); });
  }

  function buildStats(locked, pubs, lb) {
    var names = {}, rounds = [], picks = [];
    locked.forEach(function (r, i) {
      var pub = pubs[i]; if (!pub || !pub.picks) return;
      var R = { id: r.id, name: r.name, mult: r.mult, resolved: r.status === "resolved", ties: [] };
      tieIds(r).forEach(function (tid) {
        var t = r.ties[tid];
        var T = { tid: tid, home: t.home, away: t.away, ptsHome: t.ptsHome, ptsAway: t.ptsAway, winner: R.resolved ? (t.winner || null) : null, picks: {} };
        Object.keys(pub.picks).forEach(function (n) { names[n] = 1; var s = (pub.picks[n] || {})[tid]; if (s) T.picks[n] = s; });
        R.ties.push(T);
      });
      rounds.push(R);
    });
    rounds.forEach(function (R) { R.ties.forEach(function (T) { Object.keys(T.picks).forEach(function (n) {
      var side = T.picks[n];
      if (side !== "home" && side !== "away") { picks.push({ n: n, R: R, T: T, none: true }); return; }
      var me = T[side], opp = T[side === "home" ? "away" : "home"], potential = side === "home" ? T.ptsHome : T.ptsAway;
      picks.push({ n: n, R: R, T: T, side: side, club: me, opp: opp, potential: potential, decided: !!T.winner,
        won: T.winner ? T.winner === side : null, pts: T.winner === side ? potential : 0, dog: me.rank > opp.rank, gap: me.rank - opp.rank });
    }); }); });
    var rows = lb ? (Array.isArray(lb) ? lb : Object.keys(lb).map(function (k) { return lb[k]; })).filter(Boolean) : [], lbBy = {};
    rows.forEach(function (r) { lbBy[r.name] = r; names[r.name] = 1; });
    return { rounds: rounds, resolved: rounds.filter(function (R) { return R.resolved; }), mans: Object.keys(names).sort(function (a, b) { return a.localeCompare(b); }), picks: picks, lb: lbBy };
  }

  function stClubByShort(short) {
    if (!S.sp || !short) return null;
    var keys = Object.keys(S.sp.clubs);
    for (var i = 0; i < keys.length; i++) if (S.sp.clubs[keys[i]].short === short) return { key: keys[i], club: S.sp.clubs[keys[i]] };
    return null;
  }
  // Season-pick points a manager earned in one round: the Dark Horse bonus if their club won, and the Cup Winner bonus in the Final.
  function stSpecialIn(D, n, R) {
    var row = D.lb[n], pts = 0; if (!row || !S.sp) return 0;
    [["dark", row.darkClub], ["cup", row.cupClub]].forEach(function (k) {
      var c = stClubByShort(k[1]); if (!c) return;
      R.ties.forEach(function (T) {
        var side = spKey(T.home) === c.key ? "home" : spKey(T.away) === c.key ? "away" : null;
        if (!side || T.winner !== side) return;
        if (k[0] === "dark" && c.club.dark) pts += c.club.dark;
        if (k[0] === "cup" && R.id === "f") pts += c.club.cup;
      });
    });
    return pts;
  }
  function stSum(list, f) { return list.reduce(function (n, x) { return n + f(x); }, 0); }
  function stOf(D, n) { return D.picks.filter(function (p) { return p.n === n; }); }
  function stPanel(title, hint, body) { return '<div class="panel st-panel"><div class="phead"><h2>' + title + "</h2>" + (hint ? '<span class="hint">' + hint + "</span>" : "") + "</div>" + body + "</div>"; }
  function stNote(text) { return '<p class="st-note">' + text + "</p>"; }
  function stTable(head, rows) { return '<div class="lbwrap"><table class="lbtable">' + "<tr>" + head.map(function (h, i) { return "<th" + (i ? ' class="n"' : "") + ">" + h + "</th>"; }).join("") + "</tr>" + rows.join("") + "</table></div>"; }
  function stGroup(title) { return '<h3 class="st-group">' + title + "</h3>"; }

  /* --- the round --- */
  function stRound(D) {
    var R = D.rounds.filter(function (r) { return r.id === ST.round; })[0] || D.rounds[D.rounds.length - 1];
    ST.round = R.id;
    var pills = '<div class="rounds st-pills" role="group" aria-label="Round">' + D.rounds.map(function (r) {
      return '<button type="button" data-stround="' + r.id + '" aria-pressed="' + (r.id === R.id) + '">' + esc(r.name) + "</button>"; }).join("") + "</div>";
    var me = S.who && S.who.name;
    var ties = R.ties.map(function (T) {
      var h = 0, a = 0, mine = me ? T.picks[me] : null;
      Object.keys(T.picks).forEach(function (n) { if (T.picks[n] === "home") h++; else if (T.picks[n] === "away") a++; });
      function side(k, n) {
        var w = T.winner === k;
        return '<span class="st-side' + (k === "away" ? " r" : "") + (w ? " win" : T.winner ? " lost" : "") + '">' + (k === "home" ? crestHTML(T.home, true) : "") +
          "<span>" + esc(T[k].short) + (w ? " ✓" : "") + (mine === k ? ' <span class="st-you">you</span>' : "") + "</span>" + (k === "away" ? crestHTML(T.away, true) : "") + "</span>";
      }
      return '<li class="st-tie"><div class="st-line">' + side("home") + side("away") + "</div>" +
        '<div class="st-line"><b class="st-n">' + h + '</b><div class="st-bar" role="img" aria-label="' + esc(T.home.short) + " " + h + ", " + esc(T.away.short) + " " + a + '">' +
        (h ? '<i class="' + (T.winner === "home" ? "w" : "") + '" style="flex:' + h + '"></i>' : "") + (a ? '<i class="' + (T.winner === "away" ? "w" : "") + '" style="flex:' + a + '"></i>' : "") +
        '</div><b class="st-n r">' + a + "</b></div></li>";
    }).join("");
    var out = stPanel("Who backed whom", R.resolved ? "Winners ticked" : "Locked, awaiting results", pills + '<ul class="st-ties">' + ties + "</ul>");

    var rp = D.picks.filter(function (p) { return p.R === R && !p.none; }), facts = [];
    if (R.resolved) {
      // shock of the round: the result the fewest managers saw coming
      var shock = null;
      R.ties.forEach(function (T) {
        if (!T.winner) return;
        var on = rp.filter(function (p) { return p.T === T; }), got = on.filter(function (p) { return p.won; });
        if (on.length < 2) return;
        var share = got.length / on.length;
        if (share < 0.5 && (!shock || share < shock.share)) shock = { T: T, share: share, got: got, total: on.length };
      });
      facts.push(["Shock of the round", shock
        ? "<b>" + esc(shock.T[shock.T.winner].short) + "</b> knocked out " + esc(shock.T[shock.T.winner === "home" ? "away" : "home"].short) + ". " +
          (shock.got.length ? shock.got.length + " of " + shock.total + " managers predicted it: " + shock.got.map(function (p) { return stName(p.n); }).join(", ") + "." : "Nobody predicted it.")
        : "No shocks. Most managers got every result right."]);
      var tot = {}; rp.forEach(function (p) { tot[p.n] = (tot[p.n] || 0) + p.pts; });
      var best = Math.max.apply(null, Object.keys(tot).map(function (n) { return tot[n]; }).concat([0]));
      var winners = Object.keys(tot).filter(function (n) { return best > 0 && Math.abs(tot[n] - best) < 1e-9; });
      facts.push(["Round winner", winners.length ? winners.map(stName).join(" and ") + " with <b>" + fmt1(best) + "</b> points." : "Nobody scored."]);
      var bp = rp.filter(function (p) { return p.won; }).sort(function (x, y) { return y.pts - x.pts; })[0];
      if (bp) {
        var same = rp.filter(function (p) { return p.won && p.T === bp.T; });
        facts.push(["Best pick", "<b>" + esc(bp.club.short) + "</b> to beat " + esc(bp.opp.short) + ", worth <b>" + fmt1(bp.pts) + "</b> points. Predicted by " + same.map(function (p) { return stName(p.n); }).join(", ") + "."]);
      }
    }
    var wolves = [];
    R.ties.forEach(function (T) {
      var on = rp.filter(function (p) { return p.T === T; });
      if (on.length < 3) return;
      ["home", "away"].forEach(function (k) {
        var s = on.filter(function (p) { return p.side === k; });
        if (s.length === 1) wolves.push(stName(s[0].n) + " alone on " + esc(T[k].short) + (T.winner ? (s[0].won ? ' <span class="st-ok">won, +' + fmt1(s[0].pts) + "</span>" : ' <span class="st-no">lost</span>') : ""));
      });
    });
    facts.push(["Lone wolves", wolves.length ? wolves.join("<br>") : "Nobody went out on their own this round."]);
    out += stPanel(esc(R.name) + " in brief", "", '<dl class="st-facts">' + facts.map(function (f) { return "<dt>" + f[0] + "</dt><dd>" + f[1] + "</dd>"; }).join("") + "</dl>");
    return out;
  }

  /* --- the league so far --- */
  function stStandings(D) {            // league places after each scored round
    var run = {}, steps = [];
    D.mans.forEach(function (n) { run[n] = 0; });
    D.resolved.forEach(function (R) {
      D.mans.forEach(function (n) { run[n] += stSum(D.picks.filter(function (p) { return p.n === n && p.R === R && !p.none; }), function (p) { return p.pts; }) + stSpecialIn(D, n, R); });
      var order = D.mans.slice().sort(function (a, b) { return run[b] - run[a] || a.localeCompare(b); }), pos = {}, pts = {};
      order.forEach(function (n, i) { pos[n] = i + 1; pts[n] = run[n]; });
      steps.push({ R: R, pos: pos, pts: pts });
    });
    return steps;
  }
  function stTracker(D) {
    var steps = stStandings(D), N = D.mans.length, me = S.who && S.who.name;
    if (!steps.length) return stPanel("League position, round by round", "", stNote("This appears once the first round has been scored."));
    var others = D.mans.filter(function (n) { return n !== me; });
    if (ST.focus && D.mans.indexOf(ST.focus) === -1) ST.focus = "";
    // Drawn at the panel's real width, so the labels stay a readable size on a phone.
    var W = Math.max(300, Math.min(700, ($("statsView").clientWidth || 640) - 22)), H = Math.max(190, Math.min(340, 50 + N * 15)), L = 36, Rt = W < 420 ? 86 : 100, T = 14, B = 28;
    var x = function (i) { return steps.length === 1 ? L + (W - L - Rt) / 2 : L + i * (W - L - Rt) / (steps.length - 1); };
    var y = function (p) { return N === 1 ? (T + H - B) / 2 : T + (p - 1) * (H - T - B) / (N - 1); };
    var svg = '<svg viewBox="0 0 ' + W + " " + H + '" class="st-chart" role="img" aria-label="League position after each round. The table below has the same numbers.">';
    [1, N].filter(function (v, i, a) { return a.indexOf(v) === i; }).forEach(function (p) {
      svg += '<line x1="' + L + '" x2="' + (W - Rt) + '" y1="' + y(p) + '" y2="' + y(p) + '" class="st-grid"/><text x="' + (L - 8) + '" y="' + (y(p) + 4) + '" text-anchor="end" class="st-ax">' + ord(p) + "</text>";
    });
    steps.forEach(function (s, i) { svg += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle" class="st-ax">' + esc(LB_SHORT[s.R.id] || s.R.name) + "</text>"; });
    function line(n, cls, col) {
      var pts = steps.map(function (s, i) { return x(i) + "," + y(s.pos[n]); }).join(" "), o = "";
      if (steps.length > 1) o += '<polyline points="' + pts + '" fill="none" class="' + cls + '"' + (col ? ' stroke="' + col + '"' : "") + "/>";
      steps.forEach(function (s, i) {
        o += '<circle cx="' + x(i) + '" cy="' + y(s.pos[n]) + '" r="' + (col ? 4.5 : 2.5) + '" class="' + (col ? "st-dot" : "st-dot0") + '"' + (col ? ' fill="' + col + '"' : "") + "><title>" + esc(n) + ": " + ord(s.pos[n]) + " after " + esc(s.R.name) + " (" + fmt1(s.pts[n]) + " pts)</title></circle>";
      });
      if (col) { var last = steps[steps.length - 1]; o += '<text x="' + (x(steps.length - 1) + 10) + '" y="' + (y(last.pos[n]) + 4) + '" class="st-end">' + (n === me ? "You" : esc(n.length > 11 ? n.slice(0, 10) + "…" : n)) + "</text>"; }
      return o;
    }
    D.mans.forEach(function (n) { if (n !== me && n !== ST.focus) svg += line(n, "st-l0"); });
    if (ST.focus) svg += line(ST.focus, "st-l1", ST_COL.cup);
    if (me && D.mans.indexOf(me) !== -1) svg += line(me, "st-l1", ST_COL.fav);
    svg += "</svg>";
    var legend = '<div class="st-legend">' + (me && D.mans.indexOf(me) !== -1 ? '<span><i style="background:' + ST_COL.fav + '"></i>You</span>' : "") +
      (ST.focus ? '<span><i style="background:' + ST_COL.cup + '"></i>' + esc(ST.focus) + "</span>" : "") + '<span><i class="g"></i>Everyone else</span>' +
      '<label class="st-pick">Highlight <select data-stsel="focus"><option value="">nobody else</option>' + others.map(function (n) { return '<option' + (n === ST.focus ? " selected" : "") + ">" + esc(n) + "</option>"; }).join("") + "</select></label></div>";
    var order = D.mans.slice().sort(function (a, b) { var l = steps[steps.length - 1]; return l.pos[a] - l.pos[b]; });
    var table = stTable(["Manager"].concat(steps.map(function (s) { return esc(LB_SHORT[s.R.id] || s.R.name); })), order.map(function (n) {
      return "<tr" + stMe(n) + "><td>" + stName(n) + "</td>" + steps.map(function (s) { return '<td class="n">' + ord(s.pos[n]) + "</td>"; }).join("") + "</tr>"; }));
    return stPanel("League position, round by round", "1st is at the top", legend + '<div class="st-chartwrap">' + svg + "</div><details class=\"st-more\"><summary>Show as a table</summary>" + table + "</details>");
  }
  function stSources(D) {
    if (!D.resolved.length) return "";
    var rows = D.mans.map(function (n) {
      var mine = stOf(D, n).filter(function (p) { return p.won; }), lb = D.lb[n] || {};
      var r = { n: n, fav: stSum(mine.filter(function (p) { return !p.dog; }), function (p) { return p.pts; }), dog: stSum(mine.filter(function (p) { return p.dog; }), function (p) { return p.pts; }), cup: lb.cup || 0, dark: lb.dark || 0 };
      r.total = r.fav + r.dog + r.cup + r.dark; return r;
    }).sort(function (a, b) { return b.total - a.total || a.n.localeCompare(b.n); });
    var max = Math.max.apply(null, rows.map(function (r) { return r.total; }).concat([1]));
    var keys = [["fav", "Favourites"], ["dog", "Underdogs"], ["cup", "Cup Winner"], ["dark", "Dark Horse"]];
    var used = keys.filter(function (k) { return rows.some(function (r) { return r[k[0]] > 0; }); });
    var legend = '<div class="st-legend">' + used.map(function (k) { return '<span><i style="background:' + ST_COL[k[0]] + '"></i>' + k[1] + "</span>"; }).join("") + "</div>";
    var bars = rows.map(function (r) {
      return '<div class="st-srow"><span class="st-sname">' + stName(r.n) + '</span><div class="st-stack" style="width:' + (100 * r.total / max).toFixed(1) + '%">' +
        used.filter(function (k) { return r[k[0]] > 0; }).map(function (k) { return '<i style="flex:' + r[k[0]] + ";background:" + ST_COL[k[0]] + '" title="' + esc(r.n) + ", " + k[1] + ": " + fmt1(r[k[0]]) + ' pts"></i>'; }).join("") +
        '</div><b class="st-sval">' + fmt1(r.total) + "</b></div>";
    }).join("");
    var table = stTable(["Manager"].concat(used.map(function (k) { return k[1]; }), ["Total"]), rows.map(function (r) {
      return "<tr" + stMe(r.n) + "><td>" + stName(r.n) + "</td>" + used.map(function (k) { return '<td class="n">' + fmt1(r[k[0]]) + "</td>"; }).join("") + '<td class="n total">' + fmt1(r.total) + "</td></tr>"; }));
    return stPanel("Where the points came from", "", legend + '<div class="st-stacks">' + bars + "</div>" +
      stNote("An underdog is the lower-placed club in a tie. Hover or tap a bar segment for its points.") + '<details class="st-more"><summary>Show as a table</summary>' + table + "</details>");
  }
  function stGiant(D) {
    if (!D.resolved.length) return "";
    var rows = D.mans.map(function (n) {
      var dogs = stOf(D, n).filter(function (p) { return !p.none && p.decided && p.dog; }), hit = dogs.filter(function (p) { return p.won; });
      var top = hit.slice().sort(function (a, b) { return b.gap - a.gap; })[0];
      return { n: n, hit: hit.length, tried: dogs.length, gap: top ? top.gap : 0, club: top ? top.club.short + " v " + top.opp.short : "" };
    }).sort(function (a, b) { return b.hit - a.hit || b.gap - a.gap || a.n.localeCompare(b.n); });
    return stPanel("Giant-killers", "Upsets predicted", stTable(["Manager", "Upsets", "Tried", "Biggest gap"], rows.map(function (r) {
      return "<tr" + stMe(r.n) + "><td>" + stName(r.n) + '</td><td class="n total">' + r.hit + '</td><td class="n">' + r.tried + '</td><td class="n">' + (r.gap ? r.gap + (r.gap === 1 ? " place" : " places") + "<small>" + esc(r.club) + "</small>" : "-") + "</td></tr>"; })) +
      stNote("An upset is a correct prediction for the lower-placed club. The gap is how many league places separated the two."));
  }
  function stStyleRows(D) {
    return D.mans.map(function (n) {
      var mine = stOf(D, n).filter(function (p) { return !p.none; }), dec = mine.filter(function (p) { return p.decided; });
      var dogs = mine.filter(function (p) { return p.dog; }), dogDec = dogs.filter(function (p) { return p.decided; }), crowdOn = 0, crowdWith = 0;
      mine.forEach(function (p) {
        var h = 0, a = 0; Object.keys(p.T.picks).forEach(function (m) { if (p.T.picks[m] === "home") h++; else if (p.T.picks[m] === "away") a++; });
        if (h === a) return; crowdOn++; if ((h > a ? "home" : "away") === p.side) crowdWith++;
      });
      return { n: n, picks: mine.length, dec: dec.length, right: dec.filter(function (p) { return p.won; }).length, dogs: dogs.length, dogDec: dogDec.length,
        dogRight: dogDec.filter(function (p) { return p.won; }).length, crowdOn: crowdOn, crowdWith: crowdWith,
        unlucky: dec.filter(function (p) { return !p.won && p.club.p >= 0.7; }).length };
    });
  }
  function stStyle(D) {
    var rows = stStyleRows(D).sort(function (a, b) { return (b.dec ? b.right / b.dec : -1) - (a.dec ? a.right / a.dec : -1) || a.n.localeCompare(b.n); });
    return stPanel("Accuracy and style", "", stTable(["Manager", "Correct", "Backs the underdog", "Underdogs that won", "With the crowd"], rows.map(function (r) {
      return "<tr" + stMe(r.n) + "><td>" + stName(r.n) + '</td><td class="n total">' + pct(r.right, r.dec) + "<small>" + r.right + " of " + r.dec + '</small></td><td class="n">' + pct(r.dogs, r.picks) + "<small>" + r.dogs + " of " + r.picks +
        '</small></td><td class="n">' + pct(r.dogRight, r.dogDec) + "<small>" + r.dogRight + " of " + r.dogDec + '</small></td><td class="n">' + pct(r.crowdWith, r.crowdOn) + "<small>" + r.crowdWith + " of " + r.crowdOn + "</small></td></tr>"; })) +
      stNote("“With the crowd” is how often a manager picked the same side as most of the league. A low figure marks a maverick, a high one a sheep."));
  }
  function stH2H(D) {
    if (D.mans.length < 2) return "";
    var me = S.who && S.who.name;
    if (D.mans.indexOf(ST.a) === -1) ST.a = D.mans.indexOf(me) !== -1 ? me : D.mans[0];
    if (D.mans.indexOf(ST.b) === -1 || ST.b === ST.a) ST.b = D.mans.filter(function (n) { return n !== ST.a; })[0];
    function sel(k) { return '<select data-stsel="' + k + '">' + D.mans.map(function (n) { return "<option" + (n === ST[k] ? " selected" : "") + ">" + esc(n) + "</option>"; }).join("") + "</select>"; }
    var rows = [], pa = 0, pb = 0, same = 0;
    D.resolved.forEach(function (R) { R.ties.forEach(function (T) {
      var a = T.picks[ST.a], b = T.picks[ST.b]; if (!a || !b) return;
      if (a === b) { same++; return; }
      function cell(s) { if (s !== "home" && s !== "away") return "no team left"; var w = T.winner === s, v = s === "home" ? T.ptsHome : T.ptsAway; return esc(T[s].short) + (w ? ' <span class="st-ok">+' + fmt1(v) + "</span>" : ""); }
      if (T.winner === a) pa += a === "home" ? T.ptsHome : T.ptsAway;
      if (T.winner === b) pb += b === "home" ? T.ptsHome : T.ptsAway;
      rows.push("<tr><td>" + esc(LB_SHORT[R.id] || R.name) + "<small>" + esc(T.home.short) + " v " + esc(T.away.short) + '</small></td><td class="n">' + cell(a) + '</td><td class="n">' + cell(b) + "</td></tr>");
    }); });
    var sum = !D.resolved.length ? "Head to head starts once a round has been scored." : rows.length
      ? "They agreed on " + same + " ties and split on <b>" + rows.length + "</b>. From those, " + esc(ST.a) + " took <b>" + fmt1(pa) + "</b> points and " + esc(ST.b) + " took <b>" + fmt1(pb) + "</b>."
      : "These two have made the same prediction on every tie so far.";
    return stPanel("Head to head", "", '<div class="st-legend"><label class="st-pick">' + sel("a") + '</label><span>against</span><label class="st-pick">' + sel("b") + "</label></div>" + stNote(sum) +
      (rows.length ? '<div class="st-scroll">' + stTable(["Tie", esc(ST.a), esc(ST.b)], rows) + "</div>" : ""));
  }

  /* --- the Kamikaze angle --- */
  function stKamikaze(D) {
    var max = S.cfg.maxUses, used = {}, backed = {};
    D.picks.forEach(function (p) {
      if (p.none) return; var k = spKey(p.club);
      (used[p.n] = used[p.n] || {})[k] = (used[p.n][k] || 0) + 1;
      backed[k] = backed[k] || { club: p.club, n: 0 }; backed[k].n++;
    });
    // clubs still in the Cup: everyone in the latest round we know about, minus anyone already knocked out of it
    var live = S.rounds.filter(function (r) { return r.status !== "draft" && tieIds(r).length; }).pop(), alive = [];
    if (live) tieIds(live).forEach(function (tid) { var t = live.ties[tid]; ["home", "away"].forEach(function (k) { if (!(live.status === "resolved" && t.winner && t.winner !== k)) alive.push(t[k]); }); });
    alive.sort(function (a, b) { return a.rank - b.rank || String(a.short).localeCompare(String(b.short)); });
    var cols = alive.slice(0, 8), out = "";
    if (cols.length) out += stPanel("Picks left on the big clubs", "Out of " + max + " each", stTable(["Manager"].concat(cols.map(function (c) { return esc(c.short); })), D.mans.map(function (n) {
      return "<tr" + stMe(n) + "><td>" + stName(n) + "</td>" + cols.map(function (c) { var left = Math.max(0, max - ((used[n] || {})[spKey(c)] || 0)); return '<td class="n' + (left ? "" : " st-zero") + '">' + (left ? left : "used up") + "</td>"; }).join("") + "</tr>"; })) +
      stNote("The " + cols.length + " highest-placed clubs still in the Cup, and how many times each manager can still pick them."));
    var lock = D.mans.map(function (n) { var mine = stOf(D, n).filter(function (p) { return p.none; }); return { n: n, total: mine.length, by: D.rounds.map(function (R) { return mine.filter(function (p) { return p.R === R; }).length; }) }; })
      .filter(function (r) { return r.total; }).sort(function (a, b) { return b.total - a.total || a.n.localeCompare(b.n); });
    out += stPanel("Locked out", "Ties with no team left to pick", lock.length
      ? stTable(["Manager"].concat(D.rounds.map(function (R) { return esc(LB_SHORT[R.id] || R.name); }), ["Total"]), lock.map(function (r) {
          return "<tr" + stMe(r.n) + "><td>" + stName(r.n) + "</td>" + r.by.map(function (v) { return '<td class="n">' + (v || "-") + "</td>"; }).join("") + '<td class="n total">' + r.total + "</td></tr>"; }))
      : stNote("Nobody has run out of teams on any tie so far."));
    var top = Object.keys(backed).map(function (k) { return backed[k]; }).sort(function (a, b) { return b.n - a.n || a.club.rank - b.club.rank; }).slice(0, 8), mx = top.length ? top[0].n : 1;
    if (top.length) out += stPanel("Most-backed clubs", "Picks across the whole league", '<div class="st-stacks">' + top.map(function (b) {
      return '<div class="st-srow"><span class="st-sname">' + esc(b.club.short) + '</span><div class="st-stack" style="width:' + (100 * b.n / mx).toFixed(1) + '%"><i style="flex:1;background:' + ST_COL.fav + '" title="' + esc(b.club.short) + ": " + b.n + ' picks"></i></div><b class="st-sval">' + b.n + "</b></div>"; }).join("") + "</div>");
    return out;
  }

  /* --- season picks --- */
  function stSeason(D) {
    var rows = D.mans.map(function (n) { return D.lb[n]; }).filter(function (r) { return r && (r.cupClub || r.darkClub); });
    if (!rows.length) return "";
    function tally(field) {
      var by = {}; rows.forEach(function (r) { if (r[field]) (by[r[field]] = by[r[field]] || []).push(r.name); });
      return Object.keys(by).sort(function (a, b) { return by[b].length - by[a].length || a.localeCompare(b); }).map(function (c) {
        return "<tr><td>" + esc(c) + '</td><td class="n total">' + by[c].length + '</td><td class="st-wrap">' + by[c].map(stName).join(", ") + "</td></tr>"; });
    }
    function tbl(title, field) { var t = tally(field); return t.length ? stGroup(title) + '<div class="lbwrap"><table class="lbtable"><tr><th>Club</th><th class="n">Picked by</th><th>Managers</th></tr>' + t.join("") + "</table></div>" : ""; }
    var out = stPanel("Who picked whom", "", tbl("Cup Winner", "cupClub") + tbl("Dark Horse", "darkClub"));
    function state(short, kind, earned) {
      if (!short) return '<td class="n">-</td>';
      var c = stClubByShort(short), run = c ? clubRun(c.key) : null, txt = "";
      if (!c) txt = "";
      else if (kind === "cup") txt = run.champion ? '<span class="st-ok">won it, +' + fmtBonus(c.club.cup) + "</span>" : run.out ? '<span class="st-no">out</span>' : "still in, +" + fmtBonus(c.club.cup) + " if they win";
      else txt = (earned ? '<span class="st-ok">+' + fmt1(earned) + " so far</span>, " : "") + (run.out ? '<span class="st-no">out</span>' : "still in, +" + fmtBonus(c.club.dark || 0) + " a round");
      return '<td class="n">' + esc(short) + "<small>" + txt + "</small></td>";
    }
    out += stPanel("Still alive", "", stTable(["Manager", "Cup Winner", "Dark Horse"], rows.map(function (r) {
      return "<tr" + stMe(r.name) + "><td>" + stName(r.name) + "</td>" + state(r.cupClub, "cup", r.cup) + state(r.darkClub, "dark", r.dark) + "</tr>"; })));
    return out;
  }

  /* --- fun extras --- */
  function stAutopilot(D) {             // what leaving every tie to the auto-pick would have scored
    var used = {}, pts = 0, max = S.cfg.maxUses;
    D.rounds.forEach(function (R) { R.ties.forEach(function (T) {
      var first = T.home.rank <= T.away.rank ? "home" : "away", other = first === "home" ? "away" : "home", ch = null;
      if ((used[spKey(T[first])] || 0) < max) ch = first; else if ((used[spKey(T[other])] || 0) < max) ch = other;
      if (!ch) return; used[spKey(T[ch])] = (used[spKey(T[ch])] || 0) + 1;
      if (T.winner === ch) pts += ch === "home" ? T.ptsHome : T.ptsAway;
    }); });
    return pts;
  }
  function stExtras(D) {
    if (!D.resolved.length) return "";
    var auto = stAutopilot(D), tiePts = {};
    D.mans.forEach(function (n) { tiePts[n] = stSum(stOf(D, n), function (p) { return p.pts || 0; }); });
    var beating = D.mans.filter(function (n) { return tiePts[n] > auto + 1e-9; });
    var out = stPanel("Beating Q", "", stNote("Q never makes a prediction and leaves every tie to the automatic pick. Q would have <b>" + fmt1(auto) + "</b> points from ties, which would put Q <b>" + ord(beating.length + 1) + "</b> of " + (D.mans.length + 1) + ". " +
      (beating.length ? beating.length + " of " + D.mans.length + " managers are beating Q: " + beating.sort(function (a, b) { return tiePts[b] - tiePts[a]; }).map(stName).join(", ") + "." : "Nobody is beating Q yet.") + " Season picks aren't counted here."));
    var st = stStyleRows(D), awards = [];
    function best(list, f, min) { var top = null; list.forEach(function (r) { var v = f(r); if (v === null || v === undefined || isNaN(v)) return; if (!top || v > top.v) top = { v: v, n: [r.n] }; else if (v === top.v) top.n.push(r.n); }); return top && top.v > (min || 0) ? top : null; }
    var gk = null; D.picks.forEach(function (p) { if (p.won && p.dog && (!gk || p.gap > gk.gap)) gk = p; });
    if (gk) awards.push(["Giant-killer", D.picks.filter(function (p) { return p.won && p.T === gk.T && p.side === gk.side; }).map(function (p) { return stName(p.n); }).join(", "), esc(gk.club.short) + " over " + esc(gk.opp.short) + ", " + gk.gap + (gk.gap === 1 ? " place" : " places") + " apart"]);
    var a;
    if ((a = best(st.filter(function (r) { return r.dec >= 3; }), function (r) { return r.right / r.dec; }))) awards.push(["Sharpest", a.n.map(stName).join(", "), Math.round(a.v * 100) + "% of predictions correct"]);
    if ((a = best(st.filter(function (r) { return r.picks >= 3; }), function (r) { return r.dogs / r.picks; }))) awards.push(["Bravest", a.n.map(stName).join(", "), "backs the underdog " + Math.round(a.v * 100) + "% of the time"]);
    if ((a = best(st.filter(function (r) { return r.crowdOn >= 3; }), function (r) { return 1 - r.crowdWith / r.crowdOn; }))) awards.push(["Maverick", a.n.map(stName).join(", "), "goes against the crowd " + Math.round(a.v * 100) + "% of the time"]);
    if ((a = best(st.filter(function (r) { return r.crowdOn >= 3; }), function (r) { return r.crowdWith / r.crowdOn; }))) awards.push(["Sheep", a.n.map(stName).join(", "), "with the crowd " + Math.round(a.v * 100) + "% of the time"]);
    if ((a = best(st, function (r) { return r.unlucky; }))) awards.push(["Unluckiest", a.n.map(stName).join(", "), a.v + (a.v === 1 ? " strong favourite" : " strong favourites") + " let them down"]);
    var wins = {}; D.resolved.forEach(function (R) { var t = {}; D.picks.forEach(function (p) { if (p.R === R && !p.none) t[p.n] = (t[p.n] || 0) + p.pts; }); var m = Math.max.apply(null, Object.keys(t).map(function (n) { return t[n]; }).concat([0])); if (m > 0) Object.keys(t).forEach(function (n) { if (Math.abs(t[n] - m) < 1e-9) wins[n] = (wins[n] || 0) + 1; }); });
    if ((a = best(Object.keys(wins).map(function (n) { return { n: n, w: wins[n] }; }), function (r) { return r.w; }))) awards.push(["Round specialist", a.n.map(stName).join(", "), a.v + (a.v === 1 ? " round won" : " rounds won")]);
    var finished = S.rounds.some(function (r) { return r.id === "f" && r.status === "resolved"; });
    if (awards.length) out += stPanel("Awards", finished ? "Final standings" : "As things stand", '<div class="st-awards">' + awards.map(function (w) { return '<div class="st-award"><span class="st-at">' + w[0] + '</span><b>' + w[1] + "</b><span>" + w[2] + "</span></div>"; }).join("") + "</div>");
    return out;
  }

  var LB_SHORT = { r3: "R3", r4: "R4", r5: "R5", qf: "QF", sf: "SF", f: "Final" };
  function drawStats() {
    var D = ST.data, box = $("statsView");
    if (!D || !D.rounds.length) {
      box.innerHTML = '<div class="panel" style="margin-top:18px"><div class="phead"><h2>Stats</h2></div><div class="empty"><b>Nothing yet</b>Stats appear once the first round has locked. Until then everyone\'s picks stay hidden.</div></div>';
      return;
    }
    box.innerHTML = stGroup("The round") + stRound(D) + stGroup("The league so far") + stTracker(D) + stSources(D) + stGiant(D) +
      stGroup("Manager style") + stStyle(D) + stH2H(D) + stGroup("The Kamikaze angle") + stKamikaze(D) +
      (stSeason(D) ? stGroup("Season picks") + stSeason(D) : "") + (stExtras(D) ? stGroup("Extras") + stExtras(D) : "");
  }
  function renderStats() {
    var box = $("statsView");
    if (!ST.data) box.innerHTML = '<div class="panel" style="margin-top:18px"><div class="phead"><h2>Stats</h2></div><div class="empty"><b>Loading</b></div></div>';
    loadStats().then(function (D) { ST.data = D; drawStats(); }).catch(function () {
      box.innerHTML = '<div class="panel" style="margin-top:18px"><div class="phead"><h2>Stats</h2></div><div class="empty"><b>Couldn\'t load</b>Check your connection and try again.</div></div>';
    });
  }
  $("statsView").addEventListener("click", function (e) {
    var b = e.target.closest("[data-stround]"); if (!b) return;
    ST.round = b.getAttribute("data-stround"); var y = window.scrollY; drawStats(); window.scrollTo(0, y);
  });
  $("statsView").addEventListener("change", function (e) {
    var k = e.target.getAttribute && e.target.getAttribute("data-stsel"); if (!k) return;
    ST[k] = e.target.value; var y = window.scrollY; drawStats(); window.scrollTo(0, y);
    var s = $("statsView").querySelector('[data-stsel="' + k + '"]'); if (s) s.focus();
  });

  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var name = b.getAttribute("data-tab");
    if (!S.sid || !S.who) return;
    $("pickView").hidden = name !== "pick"; $("tableView").hidden = name !== "table"; $("rulesView").hidden = name !== "rules"; $("statsView").hidden = name !== "stats";
    Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (x) { x.classList.toggle("on", x === b); });
    if (name === "table") renderTable();
    if (name === "stats") renderStats();
    spWarnShow();
    window.scrollTo(0, 0);
  });

  if (DEMO) $("banner").innerHTML = '<div class="demobanner">Demo data. Sign in with <b>demo@example.com</b> / <b>demo1234</b>, or join with the code <b>DEMO</b>. Set <b>DB_URL</b> and <b>API_KEY</b> at the top of the script to connect the real database.</div>';
  boot();
})();
</script>
