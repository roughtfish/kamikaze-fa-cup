<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Kamikaze Football · FA Cup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  color-scheme: dark;
  --bg:#080d18; --panel:#101a2c; --panel-2:#16223a; --raised:#1d2c49;
  --line:#283a5c; --line-soft:#1c2a44;
  --ink:#eaf1fb; --muted:#8ea0c0; --faint:#5e7095;
  --go:#19e2a0; --go-dim:#0e7d5c; --warn:#ffc043; --danger:#ff5b7e;
  --focus:#7fb2ff;
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 12px 30px -18px rgba(0,0,0,.8);
  --disp:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --num:ui-monospace,'SF Mono','Cascadia Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:radial-gradient(1200px 500px at 50% -200px, rgba(25,226,160,.07), transparent 60%), var(--bg);
  color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased; padding-bottom:48px; min-height:100vh;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* Masthead */
header.top{border-bottom:1px solid var(--line-soft);
  background:linear-gradient(180deg, rgba(16,26,44,.9), rgba(8,13,24,.4))}
.mast{display:flex;align-items:center;gap:14px;padding:14px 16px}
.crest{width:34px;height:34px;flex:0 0 auto;filter:drop-shadow(0 0 6px rgba(148,163,184,.35))}
.crest-wind path{animation:crestDrift 2.4s ease-in-out infinite}
.crest-wind path:nth-child(2){animation-delay:.15s}
.crest-wind path:nth-child(3){animation-delay:.3s}
@keyframes crestDrift{0%,100%{transform:translateX(0);opacity:.5}50%{transform:translateX(3px);opacity:.85}}
@media (prefers-reduced-motion:reduce){.crest-wind path{animation:none}}
.title h1{font-family:var(--disp);font-weight:700;letter-spacing:.04em;margin:0;font-size:21px;line-height:1;text-transform:uppercase}
.title h1 .k{color:var(--go)}
.title .sub{font-size:11.5px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.spacer{flex:1}
.chip{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:11.5px;
  padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--go);box-shadow:0 0 8px var(--go)}

main{padding-top:18px}
.panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;box-shadow:var(--shadow)}
.panel + .panel{margin-top:16px}
.phead{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.phead h2{font-family:var(--disp);text-transform:uppercase;letter-spacing:.05em;font-size:16px;margin:0}
.phead .hint{font-size:12.5px;color:var(--muted);margin-left:auto}
.rulesbody{padding:12px 16px 14px;font-size:14.5px;color:var(--muted);line-height:1.55}
.rulesbody p{margin:0 0 8px}
.rulesbody p:last-child{margin:0}
.rulesbody b{color:var(--ink)}
.multtag{display:inline-block;font-family:var(--disp);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  font-size:12px;border:1px solid var(--warn);color:var(--warn);background:rgba(255,192,67,.08);border-radius:4px;padding:1px 7px;margin-right:6px}
.tune select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font:inherit}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-soft)}
nav.tabs button{background:none;border:0;color:var(--muted);font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;
  font-size:14px;font-weight:600;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--go)}
.rulesbody h3{font-family:var(--disp);text-transform:uppercase;letter-spacing:.04em;font-size:16px;margin:22px 0 6px;color:var(--ink)}
.rulesbody h3:first-child{margin-top:6px}
.rulesbody .note{font-size:13px;color:var(--faint)}
.quip{font-style:italic;color:var(--faint)}
.rulestag{font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--go);
  border:1px solid var(--go-dim);border-radius:5px;padding:1px 7px;margin-left:8px;vertical-align:middle}
.rulestable{margin:8px 0;width:auto;max-width:420px;border-collapse:collapse}
.rulestable th{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--faint);text-align:left;font-weight:600;padding:0 16px 4px 0}
.rulestable td{border-bottom:1px solid var(--line-soft);padding:7px 16px 7px 0;font-size:14px}
.rulestable td.num,.rulestable th.num{font-family:var(--num);text-align:right;padding:7px 0 7px 22px;color:var(--ink)}
.rulestable th.num{padding:0 0 4px 22px;font-family:var(--disp);color:var(--faint)}
.ruleslist{margin:8px 0 4px;padding-left:22px;color:var(--muted);font-size:14.5px;line-height:1.6}
.ruleslist li{margin-bottom:6px}
.ruleslist b{color:var(--ink)}
.adminbox{padding:14px 16px 16px;display:grid;gap:12px}
.adminbox label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.adminbox select,.adminbox textarea,.rankin{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;font:inherit}
.adminbox select{padding:10px 12px}
.adminbox textarea{min-height:190px;padding:12px;font-family:var(--num);font-size:13px;line-height:1.55;resize:vertical;width:100%}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btn.small{flex:0 1 auto;padding:9px 14px;font-size:14px}
.adminrow{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line-soft)}
.adminside{padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.adminside + .adminside{border-left:1px solid var(--line-soft)}
.adminside .nm{font-family:var(--disp);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1;overflow-wrap:anywhere}
.adminside .raw{font-size:12px;color:var(--faint)}
.adminside .line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rankin{width:70px;padding:6px 8px;font-family:var(--num);font-size:13px}
.minibtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer}
.minibtn:hover{border-color:var(--go-dim);color:var(--go)}
.adminsum{padding:12px 16px;border-top:1px solid var(--line-soft);font-size:13.5px;color:var(--muted)}
.adminsum b{color:var(--ink)}
.empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;font-family:var(--disp);text-transform:uppercase;letter-spacing:.05em;font-size:17px;color:var(--ink);margin-bottom:4px}
.legend{padding:12px 16px;font-size:12px;color:var(--faint);border-top:1px solid var(--line-soft)}

/* Tally bar */
.tally{position:sticky;top:0;z-index:10;margin:16px 0 0;padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:rgba(16,26,44,.92);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.tally .lab{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--muted)}
.tally .big{font-family:var(--disp);font-weight:700;font-size:24px;line-height:1.05}
.tally .big span{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.tally .right{text-align:right}
.tally .sumnum{font-family:var(--num);font-weight:600;font-size:22px;color:var(--go);font-variant-numeric:tabular-nums}

/* Ties */
.ties{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:14px}
.tie{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.tie.done{border-color:var(--go-dim)}
.sides{display:grid;grid-template-columns:1fr 1fr}
.side{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;
  padding:14px 14px 12px;background:transparent;border:0;cursor:pointer;min-height:168px;
  -webkit-tap-highlight-color:transparent}
.side + .side{border-left:1px solid var(--line-soft)}
.side:hover:not([aria-disabled="true"]):not([aria-pressed="true"]){background:var(--panel-2)}
.side .team{font-family:var(--disp);font-weight:700;font-size:21px;letter-spacing:.02em;text-transform:uppercase;line-height:1.05;padding-right:52px}
.side .where{font-size:12.5px;color:var(--muted)}
.side .pts{margin-top:auto;font-family:var(--disp);font-weight:700;font-size:52px;line-height:.95;letter-spacing:-.005em;font-variant-numeric:tabular-nums}
.side .pts small{font-size:16px;font-weight:600;letter-spacing:.06em;margin-left:4px;text-transform:uppercase;color:var(--muted)}
.side .chance{font-family:var(--num);font-size:12px;color:var(--muted);margin-top:2px}
.side .usesrow{display:flex;align-items:center;gap:6px;margin-top:6px;font-family:var(--num);font-size:11.5px;color:var(--faint)}
.upips{display:inline-flex;gap:3px}
.upips i{display:block;width:4px;height:14px;border-radius:2px;background:var(--line)}
.upips i.on{background:var(--muted)}
.upips i.now{background:var(--warn)}
.upips i.full{background:var(--danger)}
.tag{display:inline-block;margin-top:6px;width:fit-content;font-family:var(--disp);font-size:10.5px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;border-radius:4px;padding:1px 6px;border:1px solid var(--line);color:var(--muted)}
.tag.long{border-color:var(--go-dim);color:var(--go);background:rgba(25,226,160,.08)}
.tag.cap{border-color:var(--warn);color:var(--warn);background:rgba(255,192,67,.08)}
.tag.out{border-color:var(--danger);color:var(--danger);background:rgba(255,91,126,.08)}

.tier-safe .pts{color:var(--ink)}
.tier-mid .pts{color:var(--warn)}
.tier-long .pts{color:var(--go);text-shadow:0 0 18px rgba(25,226,160,.35)}

.side[aria-pressed="true"]{background:rgba(25,226,160,.09);box-shadow:inset 0 0 0 2px var(--go)}
.side[aria-pressed="true"]::after{content:"Picked";position:absolute;top:12px;right:12px;
  font-family:var(--disp);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--go-dim);color:var(--go);background:rgba(25,226,160,.12);border-radius:4px;padding:1px 6px}
.side[aria-disabled="true"]{cursor:not-allowed}
.side.used-up{opacity:.5}
.side.used-up .team,.side.used-up .pts .num{text-decoration:line-through;text-decoration-thickness:2px}
.side.locked{cursor:default}

.strip{padding:8px 14px;font-size:13px;color:var(--warn);background:rgba(255,192,67,.07);border-bottom:1px solid var(--line-soft)}
.strip.stuck{color:var(--danger);background:rgba(255,91,126,.07)}

.why{border-top:1px solid var(--line-soft);font-size:13.5px;color:var(--muted)}
.why summary{padding:9px 14px;cursor:pointer;list-style:none;font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:12.5px}
.why summary::-webkit-details-marker{display:none}
.why summary::before{content:"+  ";color:var(--go)}
.why[open] summary::before{content:"\2212  "}
.why p{margin:0;padding:0 14px 12px}

/* Actions */
.actions{margin-top:16px;display:flex;gap:10px}
.btn{flex:1;padding:13px 16px;border-radius:10px;border:1px solid var(--go);background:var(--go);color:#032117;
  font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:16px;font-weight:700;cursor:pointer}
.btn.secondary{background:transparent;border-color:var(--line);color:var(--muted)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.msg{min-height:1.4em;margin-top:10px;font-size:13.5px;color:var(--muted)}

/* Tuning */
.tune{margin-top:22px}
.tune summary{padding:12px 16px;cursor:pointer;font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:14px;color:var(--muted);list-style:none}
.tune summary::-webkit-details-marker{display:none}
.tune .body{padding:4px 16px 16px;display:grid;gap:16px;font-size:14px}
.tune label{display:grid;gap:4px}
.tune input[type=range]{width:100%;accent-color:var(--go)}
.tune .hint{color:var(--faint);font-size:12.5px}
.tune b{font-family:var(--num);color:var(--ink)}
.footnote{text-align:center;color:var(--faint);font-size:12px;margin-top:18px}

@media (max-width:480px){
  .side .pts{font-size:46px}
  .side .team{font-size:19px}
}

.rounds{display:flex;gap:6px;overflow-x:auto;padding:14px 0 2px}
.rounds button{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;
  padding:6px 14px;font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:13px;font-weight:600;cursor:pointer}
.rounds button[aria-pressed="true"]{border-color:var(--go);color:var(--go);background:rgba(25,226,160,.08)}
.deadline{margin-top:14px;padding:10px 16px;border:1px solid var(--line-soft);border-radius:12px;background:var(--panel);font-size:14px;color:var(--muted);display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.deadline b{color:var(--ink)}
.deadline.locked b{color:var(--warn)}
.deadline .dl-big{font-size:15.5px}
.deadline.soon{border-color:var(--warn)} .deadline.soon b{color:var(--warn)}
.spwarn{margin-top:14px;padding:10px 14px;border:1px solid var(--warn);border-radius:12px;background:rgba(255,192,67,.08);color:var(--ink);font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.spwarn .btn{flex:0 0 auto}
.side.won{box-shadow:inset 0 0 0 2px var(--go-dim)}
.side.lost.picked{box-shadow:inset 0 0 0 2px var(--danger)}
.side.ro{cursor:default}
.res{margin-top:6px;font-family:var(--num);font-size:12.5px}
.res.ok{color:var(--go)} .res.no{color:var(--danger)} .res.wait{color:var(--faint)}
.autoline{padding:8px 14px;font-size:13px;color:var(--muted);border-top:1px solid var(--line-soft)}
.autoline b{color:var(--ink)}
.sp{margin:14px 0}
.spbody{padding:12px 16px 14px;display:grid;gap:14px}
.spf{display:grid;gap:5px}
.spl{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:600;color:var(--ink)}
.spd{font-size:13px;color:var(--muted);line-height:1.4}
.spf select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font:inherit;font-size:16px}
.spn{font-size:13px;color:var(--go);min-height:1.3em}
.st-group{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--faint);margin:26px 2px 10px;font-weight:600}
.st-panel .st-group{margin:14px 16px 4px}
.st-panel + .st-panel{margin-top:14px}
.st-note{margin:0;padding:12px 16px 14px;color:var(--muted);font-size:13.5px;line-height:1.5}
.st-note b{color:var(--ink)}
.st-you{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:10px;font-weight:600;color:var(--go);border:1px solid var(--go-dim);border-radius:4px;padding:0 4px;vertical-align:middle}
.st-ok{color:var(--go)} .st-no{color:var(--danger)}
.st-pills{padding:12px 16px 0}
.st-ties{list-style:none;margin:0;padding:6px 16px 12px}
.st-tie{padding:10px 0;border-top:1px solid var(--line-soft)} .st-tie:first-child{border-top:0}
.st-line{display:flex;align-items:center;gap:10px}
.st-line + .st-line{margin-top:6px}
.st-side{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--ink)}
.st-side.r{justify-content:flex-end;text-align:right}
.st-side.lost{color:var(--muted);font-weight:400}
.st-side.win{color:var(--go)}
.st-n{font-family:var(--num);font-size:13px;color:var(--ink);min-width:20px} .st-n.r{text-align:right}
.st-bar{flex:1;display:flex;gap:2px;height:10px}
.st-bar i{display:block;background:#3b4d73;border-radius:3px;min-width:3px}
.st-bar i.w{background:#3987e5}
.st-facts{margin:0;padding:6px 16px 14px}
.st-facts dt{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:600;color:var(--faint);margin-top:12px}
.st-facts dd{margin:3px 0 0;font-size:14px;line-height:1.5;color:var(--muted)}
.st-facts dd b{color:var(--ink)}
.st-legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 16px 2px;font-size:13px;color:var(--muted)}
.st-legend span{display:inline-flex;align-items:center;gap:6px}
.st-legend i{width:10px;height:10px;border-radius:3px;display:inline-block} .st-legend i.g{background:#5e7095}
.st-pick{display:inline-flex;align-items:center;gap:6px}
.st-pick select{padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font:inherit;font-size:14px;max-width:170px}
.st-chartwrap{padding:8px 10px 4px}
.st-chart{width:100%;height:auto;display:block}
.st-grid{stroke:var(--line-soft);stroke-width:1}
.st-ax{fill:var(--faint);font-family:var(--num);font-size:11px}
.st-end{fill:var(--ink);font-family:var(--body);font-size:12px;font-weight:600}
.st-l0{stroke:#5e7095;stroke-width:1.2;opacity:.55;stroke-linejoin:round}
.st-l1{stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.st-dot0{fill:#5e7095;opacity:.7} .st-dot{stroke:var(--panel);stroke-width:2}
.st-more{padding:0 0 6px} .st-more summary{cursor:pointer;padding:8px 16px 10px;font-size:13px;color:var(--muted)}
.st-stacks{padding:10px 16px 4px;display:grid;gap:8px}
.st-srow{display:grid;grid-template-columns:minmax(72px,30%) minmax(0,1fr) 44px;align-items:center;gap:10px;font-size:13.5px}
.st-sname{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-stack{display:flex;gap:2px;height:14px;min-width:4px}
.st-stack i{display:block;border-radius:3px;min-width:3px}
.st-sval{font-family:var(--num);font-size:13px;color:var(--ink);text-align:right;font-weight:600}
.st-scroll{max-height:300px;overflow:auto}
.st-zero{color:var(--faint)}
.lbtable td.st-wrap{white-space:normal;font-size:13.5px;color:var(--muted);min-width:150px}
.st-awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding:14px 16px}
.st-award{border:1px solid var(--line-soft);background:var(--panel-2);border-radius:10px;padding:11px 12px;display:grid;gap:3px;font-size:13px;color:var(--muted)}
.st-award b{color:var(--ink);font-size:15px;font-weight:600}
.st-at{font-family:var(--disp);text-transform:uppercase;letter-spacing:.09em;font-size:11px;font-weight:600;color:var(--faint)}
.spstate{font-family:var(--num);font-size:13px;color:var(--go)}
.spstate.warn{color:var(--warn)}
.sprow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center}
.sprow .spl{grid-column:1 / -1;color:var(--faint);font-size:11px}
.sprow .spc{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);min-width:0}
.sprow .sps{font-family:var(--num);font-size:13px;color:var(--muted);text-align:right}
.sprow .sps.ok{color:var(--go)} .sprow .sps.no{color:var(--danger)}
.savestate{font-family:var(--num);font-size:12px;color:var(--faint);min-height:1.2em;text-align:right;margin-top:8px}
.demobanner{margin:12px 0 0;padding:8px 12px;border:1px dashed var(--warn);border-radius:10px;color:var(--warn);font-size:13px}
.lbtable{width:100%;border-collapse:collapse}
.lbtable th{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--faint);text-align:left;font-weight:600;padding:10px 12px}
.lbtable td{padding:10px 12px;border-top:1px solid var(--line-soft);font-size:14.5px}
.lbtable td.n,.lbtable th.n{text-align:right;font-family:var(--num)}
.lbtable tr.me td{background:rgba(25,226,160,.07)}
.lbtable td.pos{font-family:var(--num);color:var(--muted);width:34px}
.errorbox{margin-top:22px}
.sides{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.side{min-width:0}
/* Reserve a row for the "Picked" tag so long club names never run into it */
.side::before{content:"";display:block;height:18px;flex:0 0 auto}
.side[aria-pressed="true"]::after{right:auto;left:14px;top:12px}
.side .team{padding-right:0}

.adminbox input{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;font:inherit;padding:10px 12px;width:100%}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:inherit;font-size:13.5px;padding:6px 4px}
.linkbtn:hover{color:var(--go)}
#signOut{font-size:12.5px}

[hidden]{display:none !important}

/* Club crests: the image if we have one, otherwise a plain initials badge (an original shape, not a club mark) */
.cc{position:relative;flex:0 0 auto;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center}
.cc img{width:100%;height:100%;object-fit:contain;display:block}
.cc b{display:none;width:100%;height:100%;border-radius:50%;background:var(--raised);border:1px solid var(--line);color:var(--muted);
  font-family:var(--disp);font-size:12px;font-weight:700;letter-spacing:.04em;align-items:center;justify-content:center}
.cc.nocrest img{display:none}
.cc.nocrest b{display:flex}
.side .team{display:flex;align-items:center;gap:9px;padding-right:0}
.side .team .tn{min-width:0;overflow-wrap:anywhere}
.cc.sm{width:22px;height:22px}
.cc.sm b{font-size:9.5px}
.adminside .nm{display:flex;align-items:center;gap:8px}

.side .team .tn{overflow-wrap:break-word}
@media (max-width:480px){
  .side .team{gap:7px}
  .side .team .tn{font-size:17.5px}
  .cc{width:26px;height:26px}
  .cc b{font-size:11px}
}

/* team names scale with the screen so a long name like SUNDERLAND stays on one line beside its crest */
.side .team .tn{font-size:clamp(14px,4.3vw,21px)}
@media (max-width:400px){ .cc{width:24px;height:24px} .side .team{gap:6px} }

/* leaderboard with a column per round: scrolls sideways, rank and name stay put */
.lbwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.lbtable{min-width:100%}
.lbtable th,.lbtable td{white-space:nowrap}
.lbtable th.sticky,.lbtable td.sticky{position:sticky;background:var(--panel);z-index:1}
.lbtable .s1{left:0;min-width:38px;width:38px}
.lbtable .s2{left:38px;min-width:104px;box-shadow:1px 0 0 var(--line-soft)}
.lbtable tr.me td.sticky{background:color-mix(in srgb,var(--go) 8%,var(--panel))}
.lbtable td.total,.lbtable th.total{color:var(--ink);font-weight:600}
.lbtable td.top{color:var(--go);font-weight:600}
.lbtable small{display:block;color:var(--faint);font-family:var(--body);font-size:11px;font-weight:400;line-height:1.1}

</style>
</head>
<body>
<header class="top">
  <div class="wrap mast" style="padding-left:16px;padding-right:16px">
    <svg class="crest" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <g class="crest-wind">
        <path d="M4 24 C14 20, 22 21, 30 23" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
        <path d="M2 33 C15 30, 25 31, 33 33" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.75"/>
        <path d="M6 42 C17 40, 25 39, 31 38" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.5"/>
      </g>
      <g transform="translate(42,32)">
        <circle r="15" fill="#f8fafc" stroke="#0b1626" stroke-width="2"/>
        <polygon points="0,-6.5 6,-2 4,5 -4,5 -6,-2" fill="#0b1626"/>
        <line x1="0" y1="-6.5" x2="0" y2="-13" stroke="#0b1626" stroke-width="1.8"/>
        <line x1="6" y1="-2" x2="13" y2="-4.5" stroke="#0b1626" stroke-width="1.8"/>
        <line x1="4" y1="5" x2="8" y2="12" stroke="#0b1626" stroke-width="1.8"/>
        <line x1="-4" y1="5" x2="-8" y2="12" stroke="#0b1626" stroke-width="1.8"/>
        <line x1="-6" y1="-2" x2="-13" y2="-4.5" stroke="#0b1626" stroke-width="1.8"/>
      </g>
    </svg>
    <div class="title">
      <h1><span class="k">Kamikaze</span> Football</h1>
      <div class="sub">FA Cup · Giant-killer</div>
    </div>
    <div class="spacer"></div>
    <span class="chip" id="meChip" hidden><span class="dot"></span><span id="meText"></span></span>
    <button type="button" class="linkbtn" id="signOut" hidden>Sign out</button>
  </div>
  <div class="wrap">
    <nav class="tabs" id="tabs" hidden>
      <button data-tab="pick" class="on">Picks</button>
      <button data-tab="table">Table</button>
      <button data-tab="stats">Stats</button>
      <button data-tab="rules">Rules</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="banner"></div>
  <div id="spWarn" class="spwarn" role="status" hidden><span>You have season picks that aren’t saved yet.</span><button type="button" class="btn small" id="spWarnSave">Save them now</button></div>
  <div id="loading" class="panel" style="margin-top:18px"><div class="empty"><b>Loading</b>Getting your picks.</div></div>
  <div id="errorView" class="panel errorbox" hidden></div>
  <div id="authView" class="panel" style="margin-top:18px" hidden></div>

  <div id="pickView" hidden>
    <div class="rounds" id="rounds" role="group" aria-label="Rounds"></div>
    <div class="deadline" id="deadline"></div>

    <div class="tally" role="status" aria-live="polite">
      <div>
        <div class="lab" id="tallyLab">Ties predicted</div>
        <div class="big" id="tallyBig"></div>
      </div>
      <div class="right">
        <div class="lab" id="sumLab">If all correct</div>
        <div class="sumnum" id="sumNum">0</div>
      </div>
    </div>

    <div id="specials"></div>
    <ul class="ties" id="ties"></ul>
    <div class="savestate" id="saveState" role="status" aria-live="polite"></div>
    <div class="actions" id="actions"></div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </div>

  <div id="tableView" hidden></div>
  <div id="statsView" hidden></div>
  <div id="rulesView" hidden></div>
</main>

<script>
(function () {
  'use strict';

  /* ================= SETTINGS: edit these lines ================= */
  var CONFIG = {
    // Your Realtime Database URL, no trailing slash. While this still says YOUR-PROJECT the page runs on demo data.
    DB_URL: "https://kamikaze-fa-cup-default-rtdb.europe-west1.firebasedatabase.app",
    // Firebase project settings, Web API key. Not a secret: the database rules are what protect the data.
    API_KEY: "AIzaSyDwZ0V9GCG2i28qF0dmt9iMA0aPxpiZHr8",
    // The admin console must create rounds with exactly these ids.
    ROUND_IDS: ["r3", "r4", "r5", "qf", "sf", "f"]
  };
  /* ================================================================== */

  var params = new URLSearchParams(location.search);
  var DEMO = params.get("demo") === "1" || CONFIG.DB_URL.indexOf("YOUR-PROJECT") !== -1;
  // Adding ?rules to the address shows the rules to anyone, without signing in.
  var RULES_ONLY = params.has("rules");
  function pageLink(rulesOnly) {
    var q = []; if (params.get("demo") === "1") q.push("demo=1"); if (rulesOnly) q.push("rules");
    return location.href.split(/[?#]/)[0] + (q.length ? "?" + q.join("&") : "");
  }
  var AUTH = { uid: null, idToken: null, refreshToken: null, exp: 0, email: null };
  var NAME_OK = /^[A-Za-z0-9 ]{2,20}$/;

  function $(id) { return document.getElementById(id); }
  // Only https images (plus small inline images in demo mode). Anything else is ignored.
  function safeUrl(u) { u = String(u || ""); return /^https:\/\/[^\s"'<>]+$/.test(u) || (DEMO && /^data:image\/[a-z+]+[;,]/.test(u)) ? u : ""; }
  function initials(name) {
    var w = String(name || "").replace(/[^A-Za-z0-9 ]/g, " ").trim().split(/\s+/).filter(Boolean);
    if (!w.length) return "?";
    return (w.length === 1 ? w[0].slice(0, 2) : w[0][0] + w[1][0]).toUpperCase();
  }
  function crestHTML(side, small) {
    var u = safeUrl(side.crest);
    return '<span class="cc' + (u ? "" : " nocrest") + (small ? " sm" : "") + '" aria-hidden="true">' +
      (u ? '<img src="' + esc(u) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add(\'nocrest\')">' : "") +
      "<b>" + esc(initials(side.short || side.club)) + "</b></span>";
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }

  /* ---------------- scoring helpers (same maths as the rules page) ---------------- */
  function chanceOf(a, b, spread) { return 1 / (1 + Math.exp(-(b - a) / spread)); }
  function fmtPts(x) { return Number(x).toFixed(1); }
  function fmtChance(p) { var c = p * 100; if (c >= 99.5) return ">99%"; if (c < 1) return "<1%"; return Math.round(c) + "%"; }
  function tierClass(base) { return base < 2.5 ? "tier-safe" : base < 8 ? "tier-mid" : "tier-long"; }
  function ordinal(n) { var s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
  function rankLabel(r) {
    if (r > 92) return "Non-league";
    var name = r <= 20 ? "Premier League" : r <= 44 ? "Championship" : r <= 68 ? "League One" : "League Two";
    var start = r <= 20 ? 0 : r <= 44 ? 20 : r <= 68 ? 44 : 68;
    return name + ", " + ordinal(r - start);
  }

  /* ---------------- sign-in service: Firebase Authentication over REST, or a stand-in for the demo ---------------- */
  function denied() { var e = new Error("denied"); e.denied = true; return e; }
  function authError(code) { var e = new Error(code); e.code = String(code).split(/[ :]/)[0]; return e; }

  function RestAuth(key) { this.key = key; }
  RestAuth.prototype.idt = function (method, body) {
    return fetch("https://identitytoolkit.googleapis.com/v1/accounts:" + method + "?key=" + encodeURIComponent(this.key), {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw authError((j.error && j.error.message) || "UNKNOWN"); return j; }); });
  };
  RestAuth.prototype.signIn = function (email, password) { return this.idt("signInWithPassword", { email: email, password: password, returnSecureToken: true }); };
  RestAuth.prototype.signUp = function (email, password) { return this.idt("signUp", { email: email, password: password, returnSecureToken: true }); };
  RestAuth.prototype.reset = function (email) { return this.idt("sendOobCode", { requestType: "PASSWORD_RESET", email: email }); };
  RestAuth.prototype.remove = function (idToken) { return this.idt("delete", { idToken: idToken }); };
  RestAuth.prototype.refresh = function (refreshToken) {
    return fetch("https://securetoken.googleapis.com/v1/token?key=" + encodeURIComponent(this.key), {
      method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(refreshToken)
    }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw authError((j.error && j.error.message) || "UNKNOWN"); return j; }); });
  };

  function MockAuth() {
    this.accounts = { "demo@example.com": { uid: "u-demo", password: "demo1234" } };
    this.resets = [];
  }
  MockAuth.prototype.later = function (fn) {
    return new Promise(function (res, rej) { setTimeout(function () { try { res(fn()); } catch (e) { rej(e); } }, 90); });
  };
  MockAuth.prototype.session = function (email, uid) {
    return { localId: uid, email: email, idToken: "tok-" + uid, refreshToken: "ref-" + uid, expiresIn: "3600" };
  };
  MockAuth.prototype.signIn = function (email, password) {
    var self = this;
    return this.later(function () {
      var a = self.accounts[email.toLowerCase()];
      if (!a || a.password !== password) throw authError("INVALID_LOGIN_CREDENTIALS");
      return self.session(email, a.uid);
    });
  };
  MockAuth.prototype.signUp = function (email, password) {
    var self = this;
    return this.later(function () {
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw authError("INVALID_EMAIL");
      if (self.accounts[email.toLowerCase()]) throw authError("EMAIL_EXISTS");
      if (password.length < 6) throw authError("WEAK_PASSWORD");
      var uid = "u-" + Math.random().toString(36).slice(2, 10);
      self.accounts[email.toLowerCase()] = { uid: uid, password: password };
      return self.session(email, uid);
    });
  };
  MockAuth.prototype.reset = function (email) {
    var self = this;
    return this.later(function () {
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw authError("INVALID_EMAIL");
      self.resets.push(email.toLowerCase());
      return { email: email };
    });
  };
  MockAuth.prototype.remove = function (idToken) {
    var self = this;
    return this.later(function () {
      var uid = String(idToken).replace("tok-", "");
      Object.keys(self.accounts).forEach(function (k) { if (self.accounts[k].uid === uid) delete self.accounts[k]; });
      return {};
    });
  };
  MockAuth.prototype.refresh = function (refreshToken) {
    var uid = String(refreshToken).replace("ref-", "");
    return this.later(function () { return { id_token: "tok-" + uid, refresh_token: refreshToken, user_id: uid, expires_in: "3600" }; });
  };

  var Authn = DEMO ? new MockAuth() : new RestAuth(CONFIG.API_KEY);

  function setAuth(j) {
    AUTH.uid = j.localId; AUTH.idToken = j.idToken; AUTH.refreshToken = j.refreshToken;
    AUTH.exp = Date.now() + (parseInt(j.expiresIn, 10) || 3600) * 1000; AUTH.email = j.email || AUTH.email;
    saveSession();
  }
  function clearAuth() { AUTH.uid = AUTH.idToken = AUTH.refreshToken = AUTH.email = null; AUTH.exp = 0; }
  function saveSession() { try { localStorage.setItem("kfa_session", JSON.stringify({ uid: AUTH.uid, refreshToken: AUTH.refreshToken, email: AUTH.email })); } catch (e) { /* storage blocked */ } }
  function loadSession() { try { return JSON.parse(localStorage.getItem("kfa_session")); } catch (e) { return null; } }
  function clearSession() { try { localStorage.removeItem("kfa_session"); } catch (e) { /* ignore */ } }

  // Hand back a valid ID token, refreshing it quietly when it's about to expire.
  function ensureToken() {
    if (!AUTH.refreshToken) return Promise.resolve(null);
    if (AUTH.idToken && Date.now() < AUTH.exp - 60000) return Promise.resolve(AUTH.idToken);
    return Authn.refresh(AUTH.refreshToken).then(function (j) {
      AUTH.idToken = j.id_token; AUTH.uid = j.user_id || AUTH.uid; AUTH.refreshToken = j.refresh_token || AUTH.refreshToken;
      AUTH.exp = Date.now() + (parseInt(j.expires_in, 10) || 3600) * 1000;
      saveSession();
      return AUTH.idToken;
    });
  }

  /* ---------------- database: real (REST) or demo (in memory, with the same rules as the spec) ---------------- */
  function RestDb(base) { this.base = base.replace(/\/$/, ""); }
  RestDb.prototype.req = function (path, opts) {
    var s = this;
    return ensureToken().then(function (tok) {
      var url = s.base + "/" + path + ".json" + (tok ? "?auth=" + encodeURIComponent(tok) : "");
      return fetch(url, opts).then(function (r) {
        if (r.status === 401 || r.status === 403) throw denied();
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      });
    });
  };
  RestDb.prototype.get = function (path) { return this.req(path); };
  RestDb.prototype.put = function (path, value) { return this.req(path, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(value) }); };
  RestDb.prototype.remove = function (path) { return this.req(path, { method: "DELETE" }); };

  function MockDb(seed) { this.d = seed; }
  MockDb.prototype.walk = function (path) {
    var n = this.d, p = path.split("/");
    for (var i = 0; i < p.length; i++) { if (n == null || typeof n !== "object") return null; n = n[p[i]]; if (n === undefined) return null; }
    return n;
  };
  MockDb.prototype.later = function (fn) {
    return new Promise(function (res, rej) { setTimeout(function () { try { res(fn()); } catch (e) { rej(e); } }, 90); });
  };
  MockDb.prototype.isMember = function (sid, uid) { return !!uid && this.walk("kamikaze_fa/seasons/" + sid + "/managers/" + uid) != null; };
  MockDb.prototype.get = function (path) {
    var self = this;
    return this.later(function () {
      var uid = AUTH.uid, m;
      if ((m = path.match(/^kamikaze_fa\/seasons\/([^/]+)\/(.*)$/))) {
        var sid = m[1], rest = m[2], q;
        if ((q = rest.match(/^rounds\/[^/]+$/))) { /* public */ }
        else if ((q = rest.match(/^ties\/([^/]+)$/))) {
          var st = self.walk("kamikaze_fa/seasons/" + sid + "/rounds/" + q[1] + "/status");
          if (!self.isMember(sid, uid) || st == null || st === "draft") throw denied();
        } else if ((q = rest.match(/^picks\/[^/]+\/([^/]+)$/))) { if (!uid || uid !== q[1]) throw denied(); }
        else if ((q = rest.match(/^managers\/([^/]+)$/))) { if (!uid || uid !== q[1]) throw denied(); }
        else if (rest === "specials/clubs") {
          var s3 = self.walk("kamikaze_fa/seasons/" + sid + "/rounds/r3/status");
          if (!self.isMember(sid, uid) || s3 === "draft") throw denied();
        } else if ((q = rest.match(/^specials\/picks\/([^/]+)$/))) { if (!uid || uid !== q[1]) throw denied(); }
        else throw denied();   // names, joinCode and anything else is admin-only
      }
      var v = self.walk(path);
      return v == null ? null : JSON.parse(JSON.stringify(v));
    });
  };
  MockDb.prototype.put = function (path, value) { return this.write(path, value); };
  MockDb.prototype.remove = function (path) { return this.write(path, null); };
  MockDb.prototype.write = function (path, value) {
    var self = this;
    return this.later(function () {
      var uid = AUTH.uid, m, base;
      if (!uid) throw denied();
      if ((m = path.match(/^kamikaze_fa\/seasons\/([^/]+)\/names\/([^/]+)$/))) {
        var cur = self.walk(path);
        if (!/^[a-z0-9 ]{2,20}$/.test(m[2])) throw denied();
        if (value === null) { if (cur !== uid) throw denied(); }
        else if (value !== uid || (cur != null && cur !== uid)) throw denied();
      } else if ((m = path.match(/^kamikaze_fa\/seasons\/([^/]+)\/managers\/([^/]+)$/))) {
        base = "kamikaze_fa/seasons/" + m[1] + "/";
        if (m[2] !== uid || self.walk(path) != null || value === null) throw denied();
        if (joinShut(self.walk(base + "rounds/r3"))) throw denied();
        if (Object.keys(value).some(function (k) { return k !== "name" && k !== "code"; })) throw denied();
        if (typeof value.name !== "string" || !NAME_OK.test(value.name)) throw denied();
        if (self.walk(base + "names/" + value.name.toLowerCase()) !== uid) throw denied();
        if (value.code !== self.walk(base + "joinCode")) throw denied();
      } else if ((m = path.match(/^kamikaze_fa\/seasons\/([^/]+)\/picks\/([^/]+)\/([^/]+)\/([^/]+)$/))) {
        base = "kamikaze_fa/seasons/" + m[1] + "/";
        if (m[3] !== uid || !self.isMember(m[1], uid)) throw denied();
        if (self.walk(base + "rounds/" + m[2] + "/status") !== "open") throw denied();
        if (!(Date.now() < self.walk(base + "rounds/" + m[2] + "/locksAt"))) throw denied();
        if (self.walk(base + "ties/" + m[2] + "/" + m[4]) == null) throw denied();
        if (value !== null) {
          if (Object.keys(value).some(function (k) { return k !== "side" && k !== "auto"; })) throw denied();
          if (value.side !== "home" && value.side !== "away") throw denied();
          if ("auto" in value && value.auto !== false) throw denied();
        }
      } else if ((m = path.match(/^kamikaze_fa\/seasons\/([^/]+)\/specials\/picks\/([^/]+)\/(cup|dark)$/))) {
        base = "kamikaze_fa/seasons/" + m[1] + "/";
        if (m[2] !== uid || !self.isMember(m[1], uid)) throw denied();
        if (self.walk(base + "rounds/r3/status") !== "open") throw denied();
        if (!(Date.now() < self.walk(base + "rounds/r3/locksAt"))) throw denied();
        if (value !== null) {
          var club = typeof value === "string" ? self.walk(base + "specials/clubs/" + value) : null;
          if (!club || (m[3] === "dark" && !club.dark)) throw denied();
        }
      } else throw denied();
      var parts = path.split("/"), node = self.d;
      for (var i = 0; i < parts.length - 1; i++) { node[parts[i]] = node[parts[i]] || {}; node = node[parts[i]]; }
      if (value === null) delete node[parts[parts.length - 1]]; else node[parts[parts.length - 1]] = value;
      return value;
    });
  };

  function buildDemoSeed() {
    var cfg = { maxUses: 2, cap: 30, spread: 17, specials: true };
    var now = Date.now(), DAY = 86400000;
    function demoCrest(name) {
      if (name === "Everton") return "https://crests.invalid/broken.png";           // a picture that won't load, to show the fallback
      if (["Man City", "Newcastle", "Arsenal", "Liverpool", "Sunderland"].indexOf(name) === -1) return undefined;
      var hue = (name.charCodeAt(0) * 37 + name.length * 11) % 360;
      return "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><path d="M6 4h28v20c0 8-8 12-14 14C14 36 6 32 6 24z" fill="hsl(' + hue + ',55%,45%)"/></svg>');
    }
    function mk(hS, hR, aS, aR, mult, winner) {

    if ((used[clubOf(tie, first)] || 0) < S.cfg.maxUses) return first;
    if ((used[clubOf(tie, other)] || 0) < S.cfg.maxUses) return other;
    return null;
  }
  function pickResult(round, tid) {
    var pk = round.picks[tid], tie = round.ties[tid];
    if (!pk || (pk.side !== "home" && pk.side !== "away")) return { state: "none", pts: 0 };
    if (!tie.winner) return { state: "wait", pts: 0 };
    if (pk.side === tie.winner) return { state: "ok", pts: pk.side === "home" ? tie.ptsHome : tie.ptsAway };
    return { state: "no", pts: 0 };
  }
  function roundScore(round) { return tieIds(round).reduce(function (n, t) { return n + pickResult(round, t).pts; }, 0); }
  function totalScore() { return S.rounds.filter(function (r) { return r.status === "resolved"; }).reduce(function (n, r) { return n + roundScore(r); }, 0) + specialsScore().total; }

  /* ---------------- season picks: Cup Winner and Dark Horse ---------------- */
  function spKey(sd) { return sd.key || sd.club || sd.short; }
  function spLocked() { var r3 = roundById("r3"); return !!r3 && (r3.status === "locked" || r3.status === "resolved"); }
  function fmtBonus(x) { return Number.isInteger(x) ? String(x) : Number(x).toFixed(1); }
  // How far a club has gone in finished rounds.
  function clubRun(key) {
    var wins = 0, champion = false, out = false;
    S.rounds.forEach(function (r) {
      if (r.status !== "resolved") return;
      tieIds(r).forEach(function (tid) {
        var t = r.ties[tid], side = spKey(t.home) === key ? "home" : spKey(t.away) === key ? "away" : null;
        if (!side || !t.winner) return;
        if (t.winner === side) { wins++; if (r.id === "f") champion = true; } else out = true;
      });
    });
    return { wins: wins, champion: champion, out: out };
  }
  // Season picks only count once Round 3 has locked, the same as on the leaderboard.
  function specialsScore() {
    var res = { cup: 0, dark: 0, total: 0 };
    if (!S.sp || !spLocked()) return res;
    var c = S.sp.clubs[S.sp.picks.cup], d = S.sp.clubs[S.sp.picks.dark];
    if (c && clubRun(S.sp.picks.cup).champion) res.cup = c.cup;
    if (d && d.dark) res.dark = d.dark * clubRun(S.sp.picks.dark).wins;
    res.total = res.cup + res.dark;
    return res;
  }
  function spOptions(kind, cur) {
    var clubs = S.sp.clubs;
    var keys = Object.keys(clubs).filter(function (k) { return kind === "cup" || clubs[k].dark; })
      .sort(function (a, b) { return clubs[a].rank - clubs[b].rank || String(clubs[a].short).localeCompare(String(clubs[b].short)); });
    return '<option value="">Choose a club</option>' + keys.map(function (k) {
      return '<option value="' + esc(k) + '"' + (k === cur ? " selected" : "") + ">" + esc(clubs[k].short) + " \u00b7 +" + fmtBonus(clubs[k][kind]) + (kind === "dark" ? " a round" : "") + "</option>";
    }).join("");
  }
  function renderSpecials() {
    var box = $("specials"), r3 = roundById("r3");
    spWarnShow();
    if (!S.sp || !r3) { box.innerHTML = ""; return; }
    var clubs = S.sp.clubs, mine = S.sp.picks, c = clubs[mine.cup], d = clubs[mine.dark];
    if (isEditable(r3)) {
      if (S.view !== "r3") { box.innerHTML = ""; return; }
      // Choices sit in a draft until the Save button is pressed.
      var cur = S.spDraft || { cup: mine.cup || "", dark: mine.dark || "" };
      var dirty = (cur.cup || "") !== (mine.cup || "") || (cur.dark || "") !== (mine.dark || "");
      var saved = !dirty && (mine.cup || mine.dark);
      c = clubs[cur.cup]; d = clubs[cur.dark];
      box.innerHTML = '<div class="panel sp"><div class="phead"><h2>Season picks</h2><span class="hint">Lock with Round 3</span></div><div class="spbody">' +
        '<label class="spf"><span class="spl">Cup Winner</span><span class="spd">Who will win the Cup? You get the bonus if they do. The less likely the club, the bigger the bonus.</span>' +
        '<select data-sp="cup" aria-label="Cup Winner">' + spOptions("cup", cur.cup) + "</select>" +
        '<span class="spn">' + (c ? esc(c.short) + " (" + rankLabel(c.rank) + "): +" + fmtBonus(c.cup) + " if they win the Cup." : "") + "</span></label>" +
        '<label class="spf"><span class="spl">Dark Horse</span><span class="spd">A club from outside the Premier League. You get its bonus every time it wins a round.</span>' +
        '<select data-sp="dark" aria-label="Dark Horse">' + spOptions("dark", cur.dark) + "</select>" +
        '<span class="spn">' + (d ? esc(d.short) + " (" + rankLabel(d.rank) + "): +" + fmtBonus(d.dark) + " for every round they win." : "") + "</span></label>" +
        '<div class="btnrow" style="align-items:center"><button type="button" class="btn small" id="spSave"' + (dirty ? "" : " disabled") + ">Save season picks</button>" +
        '<span class="spstate' + (dirty ? " warn" : "") + '" role="status">' + (dirty ? "Not saved yet" : saved ? (S.spSaved ? "Saved" : "Saved earlier") : "") + "</span></div>" +
        "</div></div>";
      return;
    }
    var locked = spLocked();
    function row(label, club, text, cls) {
      return '<div class="sprow"><span class="spl">' + label + '</span><span class="spc">' + (club ? crestHTML(club, true) + "<span>" + esc(club.short) + "</span>" : '<span style="color:var(--muted);font-weight:400">No pick made</span>') +
        '</span><span class="sps' + (cls ? " " + cls : "") + '">' + text + "</span></div>";
    }
    var cupText = "", cupCls = "", darkText = "", darkCls = "";
    if (c) {
      var cr = clubRun(mine.cup);
      if (cr.champion) { cupText = "Won the Cup, +" + fmtBonus(c.cup); cupCls = "ok"; }
      else if (cr.out) { cupText = "Knocked out, 0"; cupCls = "no"; }
      else cupText = "+" + fmtBonus(c.cup) + " if they win the Cup";
    }
    if (d) {
      var dr = clubRun(mine.dark);
      if (dr.wins) { darkText = "+" + fmtPts(d.dark * dr.wins) + " from " + dr.wins + (dr.wins === 1 ? " round won" : " rounds won") + (dr.out ? ", now out" : ""); darkCls = "ok"; }
      else if (dr.out) { darkText = "Knocked out, 0"; darkCls = "no"; }
      else darkText = "+" + fmtBonus(d.dark) + " for every round won";
    }
    box.innerHTML = '<div class="panel sp"><div class="phead"><h2>Season picks</h2><span class="hint">' + (locked ? "Locked with Round 3" : "Closing") + '</span></div><div class="spbody">' +
      row("Cup Winner", c, cupText, cupCls) + row("Dark Horse", d, darkText, darkCls) + "</div></div>";
  }
  // True while there are Cup Winner or Dark Horse choices that haven't been saved.
  function spDirty() {
    var r3 = roundById("r3");
    if (!S.sp || !S.spDraft || !S.who || !r3 || !isEditable(r3)) return false;
    var mine = S.sp.picks;
    return (S.spDraft.cup || "") !== (mine.cup || "") || (S.spDraft.dark || "") !== (mine.dark || "");
  }
  // The warning bar shows on every tab except the one where the Save button is already in view.
  function spWarnShow() {
    var onForm = !$("pickView").hidden && S.view === "r3";
    $("spWarn").hidden = !spDirty() || onForm;
  }
  window.addEventListener("beforeunload", function (e) { if (spDirty()) { e.preventDefault(); e.returnValue = ""; } });
  $("spWarn").addEventListener("click", function (e) { if (e.target.id === "spWarnSave") saveSpecials(); });

  function saveSpecials() {
    var r3 = roundById("r3"); if (!S.sp || !S.spDraft || !r3 || !isEditable(r3)) return;
    var cur = S.spDraft, mine = S.sp.picks, jobs = [];
    ["cup", "dark"].forEach(function (kind) {
      if ((cur[kind] || "") === (mine[kind] || "")) return;
      var path = P("specials/picks/" + AUTH.uid + "/" + kind);
      jobs.push((cur[kind] ? db.put(path, cur[kind]) : db.remove(path)).then(function () {
        if (cur[kind]) mine[kind] = cur[kind]; else delete mine[kind];
      }));
    });
    if (!jobs.length) return;
    var btn = $("spSave"); if (btn) { btn.disabled = true; btn.textContent = "Saving\u2026"; }
    saving++; $("msg").textContent = "";
    Promise.all(jobs).then(function () {
      saving--; S.spDraft = null; S.spSaved = true; renderSpecials();
    }).catch(function (e) {
      saving--; renderSpecials();
      $("msg").textContent = e && e.denied
        ? "Your season picks weren't saved. Round 3 may have just locked. Reload to see where things stand."
        : "Your season picks weren't saved. Check your connection and press Save again.";
    });
  }
  function isEditable(round) { return round.status === "open" && Date.now() < round.locksAt; }

  /* ---------------- rendering: picks ---------------- */
  function renderAll() {
    $("meText").textContent = S.who.name + " · " + fmtPts(totalScore()) + " pts";
    renderRoundButtons(); renderPick(); renderRules();

  function renderRoundButtons() {
    var live = S.rounds.filter(function (r) { return r.status !== "draft"; });
    $("rounds").innerHTML = live.map(function (r) {
      return '<button type="button" data-rid="' + esc(r.id) + '" aria-pressed="' + (r.id === S.view) + '">' + esc(r.name) + "</button>";
    }).join("");
    $("rounds").hidden = live.length < 2;
  }

  function fmtWhen(ms) {
    return new Date(ms).toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  }
  function fmtLeft(ms) {
    var m = Math.floor(ms / 60000);
    if (m < 1) return "less than a minute";
    var d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
    return d ? d + "d " + h + "h" : h ? h + "h " + mm + "m" : mm + "m";
  }
  // The same, in words: "2 days 4 hours", "3 hours 20 minutes", "12 minutes".
  function fmtLeftWords(ms) {
    var m = Math.floor(ms / 60000);
    if (m < 1) return "less than a minute";
    var d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
    function w(n, unit) { return n + " " + unit + (n === 1 ? "" : "s"); }
    return d ? w(d, "day") + (h ? " " + w(h, "hour") : "") : h ? w(h, "hour") + (mm ? " " + w(mm, "minute") : "") : w(mm, "minute");
  }
  function renderDeadline() {
    var r = roundById(S.view), el = $("deadline");
    if (!r) { el.hidden = true; return; }
    el.hidden = false;
    var editable = isEditable(r);
    var left = r.locksAt - Date.now();
    el.className = "deadline" + (editable ? (left < 86400000 ? " soon" : "") : " locked");
    if (editable) el.innerHTML = '<span class="dl-big">Locks in <b>' + fmtLeftWords(left) + "</b></span><span>" + esc(fmtWhen(r.locksAt)) + "</span>";
    else if (r.status === "open") el.innerHTML = "<span><b>Time's up.</b> Waiting for the admin to lock the round.</span>";
    else el.innerHTML = "<span><b>" + (r.status === "resolved" ? "Round finished" : "Picks locked") + "</b></span><span>" + esc(fmtWhen(r.locksAt)) + "</span>";
  }

  function sideHTML(round, tid, key, tie, editable, used) {
    var me = tie[key], other = tie[key === "home" ? "away" : "home"];
    var pts = key === "home" ? tie.ptsHome : tie.ptsAway;
    var base = pts / round.mult;
    var p = typeof me.p === "number" ? me.p : chanceOf(me.rank, other.rank, S.cfg.spread);
    var pk = round.picks[tid], picked = !!pk && pk.side === key;
    var uses = used[clubOf(tie, key)] || 0;
    var exhausted = editable && uses >= S.cfg.maxUses;
    var cls = "side " + tierClass(base) + (exhausted ? " used-up" : "") + (editable ? "" : " ro");
    if (tie.winner) cls += tie.winner === key ? " won" : " lost";
    if (picked) cls += " picked";
    var tag = "";
    if (exhausted) tag = '<span class="tag out">Used up</span>';
    else if (tie.winner === key) tag = '<span class="tag long">Went through</span>';
    else if (base >= S.cfg.cap - 1e-9) tag = '<span class="tag cap">Capped at ' + Math.round(S.cfg.cap * round.mult) + "</span>";
    else if (base >= 8) tag = '<span class="tag long">Long shot</span>';
    var usesRow = "";
    if (editable) {
      var pips = "";
      for (var i = 0; i < S.cfg.maxUses; i++) {
        var c = i < uses ? (uses >= S.cfg.maxUses ? "full" : "on") : (i === uses && picked ? "now" : "");
        pips += "<i" + (c ? ' class="' + c + '"' : "") + "></i>";
      }
      var txt = picked ? (uses + 1 >= S.cfg.maxUses ? "final use" : (uses + 1) + " of " + S.cfg.maxUses + " used") : uses + " of " + S.cfg.maxUses + " used";
      if (exhausted) txt = uses + " of " + S.cfg.maxUses + " used";
      usesRow = '<span class="usesrow"><span class="upips" aria-hidden="true">' + pips + "</span><span>" + txt + "</span></span>";
    }
    var res = "";
    if (picked && !editable) {
      var r = pickResult(round, tid);
      var auto = pk.auto ? " (auto-pick)" : "";
      res = r.state === "ok" ? '<span class="res ok">Correct, +' + fmtPts(r.pts) + auto + "</span>"
        : r.state === "no" ? '<span class="res no">Wrong, 0' + auto + "</span>"
        : '<span class="res wait">Your pick' + auto + "</span>";
    }
    return '<button type="button" class="' + cls + '" data-tid="' + esc(tid) + '" data-side="' + key + '" aria-pressed="' + picked + '"' +
      (exhausted || !editable ? ' aria-disabled="true"' : "") + ">" +
      '<span class="team">' + crestHTML(me) + '<span class="tn">' + esc(me.short || me.club) + "</span></span>" +
      '<span class="where">' + rankLabel(me.rank) + "</span>" +
      '<span class="pts">' + fmtPts(pts) + "<small>pts</small></span>" +
      '<span class="chance">' + fmtChance(p) + " to go through</span>" + usesRow + tag + res + "</button>";
  }

  function stripHTML(tie, used, editable) {
    if (!editable) return "";
    var mx = S.cfg.maxUses, h = (used[clubOf(tie, "home")] || 0) >= mx, a = (used[clubOf(tie, "away")] || 0) >= mx;
    if (h && a) return '<div class="strip stuck">Both teams are used up, so there is no pick here. This tie scores 0.</div>';
    if (h) return '<div class="strip">' + esc(tie.home.short) + " are used up, so " + esc(tie.away.short) + " is your only option.</div>";
    if (a) return '<div class="strip">' + esc(tie.away.short) + " are used up, so " + esc(tie.home.short) + " is your only option.</div>";
    return "";
  }

  function renderPick() {
    var round = roundById(S.view);
    renderSpecials();
    if (!round) {
      $("ties").innerHTML = '<li class="tie"><div class="empty"><b>Nothing open yet</b>The first round appears here once the admin opens it.</div></li>';
      $("actions").innerHTML = ""; $("deadline").hidden = true; $("tallyBig").textContent = ""; $("sumNum").textContent = "";
      return;
    }
    var editable = isEditable(round), used = usedBefore(round.id), ids = tieIds(round);
    renderDeadline();
    var html = "", called = 0, needed = 0, potential = 0;
    ids.forEach(function (tid) {
      var tie = round.ties[tid], pk = round.picks[tid];
      var pickable = (used[clubOf(tie, "home")] || 0) < S.cfg.maxUses || (used[clubOf(tie, "away")] || 0) < S.cfg.maxUses;
      if (editable) {
        if (pickable) needed++;
        if (pk && (pk.side === "home" || pk.side === "away")) { called++; potential += pk.side === "home" ? tie.ptsHome : tie.ptsAway; }
      }
      var autoLine = "";
      if (editable && !(pk && pk.side) && pickable) {
        var ch = autoChoice(tie, used);
        if (ch) autoLine = '<div class="autoline">If you leave this, we\'ll pick <b>' + esc(tie[ch].short) + "</b> for you.</div>";
      }
      html += '<li class="tie' + (editable && pk ? " done" : "") + '">' + stripHTML(tie, used, editable) + '<div class="sides">' +
        sideHTML(round, tid, "home", tie, editable, used) + sideHTML(round, tid, "away", tie, editable, used) + "</div>" + autoLine + "</li>";
    });
    if (!ids.length) html = '<li class="tie"><div class="empty"><b>No ties yet</b>The admin is still adding this round.</div></li>';
    $("ties").innerHTML = html;

    if (editable) {
      $("tallyLab").textContent = "Ties predicted"; $("sumLab").textContent = "If all correct";
      $("tallyBig").innerHTML = called + " <span>of " + needed + (needed < ids.length ? " (" + (ids.length - needed) + " can't be picked)" : "") + "</span>";
      $("sumNum").textContent = potential ? fmtPts(potential) + " pts" : "0";
      $("actions").innerHTML = "";
    } else {
      var allDone = round.status === "resolved";

      $("tallyBig").innerHTML = allDone ? esc(round.name) : (round.status === "open" ? "Closing" : "Locked");
      $("sumLab").textContent = allDone ? "You scored" : "Picks made";
      $("sumNum").textContent = allDone ? fmtPts(roundScore(round)) + " pts" : String(ids.filter(function (t) { return round.picks[t] && round.picks[t].side; }).length);
      $("actions").innerHTML = "";
    }
  }

  /* ---------------- saving picks ---------------- */
  var saving = 0, queue = [];
  function setSave(text) { $("saveState").textContent = text; }
  function pickPath(rid, tid) { return P("picks/" + rid + "/" + AUTH.uid + "/" + tid); }

  function savePick(round, tid, side) {
    var before = round.picks[tid];
    if (side) round.picks[tid] = { side: side, auto: false }; else delete round.picks[tid];
    renderPick(); saving++; setSave("Saving…");
    var op = side ? db.put(pickPath(round.id, tid), { side: side, auto: false }) : db.remove(pickPath(round.id, tid));
    return op.then(function () { saving--; if (!saving) setSave("Saved"); return true; }).catch(function (e) {

      renderPick();
      setSave("");
      $("msg").textContent = e && e.denied
        ? "That pick wasn't saved. The round may have just locked. Reload to see where things stand."
        : "That pick wasn't saved. Check your connection and try again.";
      return false;
    });
  }

  $("ties").addEventListener("click", function (e) {

  $("specials").addEventListener("change", function (e) {

  // Share the rules: copy a link that opens them without signing in.

    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(shown, manual); else manual();
  });

  $("rounds").addEventListener("click", function (e) {

    S.view = b.getAttribute("data-rid"); $("msg").textContent = ""; setSave("");
    renderRoundButtons(); renderPick();

  /* ---------------- table (leaderboard) ---------------- */
  function fmt1(x) { return Number(x).toFixed(1); }
  function renderTable() {
    var box = $("tableView");
    box.innerHTML = '<div class="panel" style="margin-top:18px"><div class="phead"><h2>Leaderboard</h2></div><div class="empty"><b>Loading</b></div></div>';
    db.get("kamikaze_fa_public/seasons/" + S.sid + "/leaderboard").then(function (lb) {
      var rows = lb ? (Array.isArray(lb) ? lb : Object.keys(lb).map(function (k) { return lb[k]; })) : [];
      rows = rows.filter(Boolean).sort(function (a, b) { return b.points - a.points; });
      if (!rows.length) { box.querySelector(".empty").innerHTML = "<b>Nothing yet</b>Scores appear here once the first round is scored."; return; }
      var LB_LABEL = { r3: "R3", r4: "R4", r5: "R5", qf: "QF", sf: "SF", f: "Final" };
      var ids = CONFIG.ROUND_IDS.filter(function (id) { return rows.some(function (r) { return r.rounds && r.rounds[id] !== undefined; }); });
      var top = {}; ids.forEach(function (id) { top[id] = Math.max.apply(null, rows.map(function (r) { return (r.rounds && r.rounds[id]) || 0; })); });
      var sp = rows.some(function (r) { return r.cupClub || r.darkClub; });
      function spTd(pts, club) { return '<td class="n' + (pts ? " top" : "") + '">' + (club ? (pts ? fmt1(pts) : "0") + "<small>" + esc(club) + "</small>" : "-") + "</td>"; }
      box.innerHTML = '<div class="panel" style="margin-top:18px"><div class="phead"><h2>Leaderboard</h2>' + (ids.length ? '<span class="hint">Points in each finished round</span>' : "") + '</div><div class="lbwrap">' +
        '<table class="lbtable"><tr><th class="sticky s1">#</th><th class="sticky s2">Manager</th><th class="n total">Total</th>' +
        ids.map(function (id) { return '<th class="n">' + LB_LABEL[id] + "</th>"; }).join("") + (sp ? '<th class="n">Cup Winner</th><th class="n">Dark Horse</th>' : "") + '<th class="n">Correct</th><th class="n">Biggest gap</th></tr>' +
        rows.map(function (r, i) {
          return '<tr class="' + (r.name === S.who.name ? "me" : "") + '"><td class="pos sticky s1">' + (i + 1) + '</td><td class="sticky s2">' + esc(r.name) + '</td><td class="n total">' + fmt1(r.points || 0) + "</td>" +
            ids.map(function (id) { var v = (r.rounds && r.rounds[id]) || 0; return '<td class="n' + (v > 0 && v === top[id] ? " top" : "") + '">' + (v ? fmt1(v) : "0") + "</td>"; }).join("") +
            (sp ? spTd(r.cup, r.cupClub) + spTd(r.dark, r.darkClub) : "") +
            '<td class="n">' + (r.correct || 0) + '</td><td class="n">' + (r.bestGap ? r.bestGap + "<small>" + esc(r.bestGapClub || "") + "</small>" : "-") + "</td></tr>";
        }).join("") + '</table></div><p class="hint" style="padding:10px 16px 14px;margin:0">Biggest gap: the most league places between the two clubs in a tie where you backed the lower-placed club and it went through.' + (sp ? " Cup Winner and Dark Horse show each manager\u2019s season picks and the bonus points they have earned so far." : "") + "</p></div>";
    }).catch(function () {
