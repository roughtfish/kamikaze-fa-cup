<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Kamikaze Football · FA Cup admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  color-scheme: dark;
  --bg:#080d18; --panel:#101a2c; --panel-2:#16223a; --raised:#1d2c49;
  --line:#283a5c; --line-soft:#1c2a44;
  --ink:#eaf1fb; --muted:#8ea0c0; --faint:#5e7095;
  --go:#19e2a0; --go-dim:#0e7d5c; --warn:#ffc043; --danger:#ff5b7e;
  --focus:#7fb2ff;
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 12px 30px -18px rgba(0,0,0,.8);
  --disp:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --num:ui-monospace,'SF Mono','Cascadia Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:radial-gradient(1200px 500px at 50% -200px, rgba(25,226,160,.07), transparent 60%), var(--bg);
  color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased; padding-bottom:48px; min-height:100vh;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* Masthead */
header.top{border-bottom:1px solid var(--line-soft);
  background:linear-gradient(180deg, rgba(16,26,44,.9), rgba(8,13,24,.4))}
.mast{display:flex;align-items:center;gap:14px;padding:14px 16px}
.crest{width:34px;height:34px;flex:0 0 auto;filter:drop-shadow(0 0 6px rgba(148,163,184,.35))}
.crest-wind path{animation:crestDrift 2.4s ease-in-out infinite}
.crest-wind path:nth-child(2){animation-delay:.15s}
.crest-wind path:nth-child(3){animation-delay:.3s}
@keyframes crestDrift{0%,100%{transform:translateX(0);opacity:.5}50%{transform:translateX(3px);opacity:.85}}
@media (prefers-reduced-motion:reduce){.crest-wind path{animation:none}}
.title h1{font-family:var(--disp);font-weight:700;letter-spacing:.04em;margin:0;font-size:21px;line-height:1;text-transform:uppercase}
.title h1 .k{color:var(--go)}
.title .sub{font-size:11.5px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.spacer{flex:1}
.chip{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:11.5px;
  padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--go);box-shadow:0 0 8px var(--go)}

main{padding-top:18px}
.panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;box-shadow:var(--shadow)}
.panel + .panel{margin-top:16px}
.phead{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.phead h2{font-family:var(--disp);text-transform:uppercase;letter-spacing:.05em;font-size:16px;margin:0}
.phead .hint{font-size:12.5px;color:var(--muted);margin-left:auto}
.rulesbody{padding:12px 16px 14px;font-size:14.5px;color:var(--muted);line-height:1.55}
.rulesbody p{margin:0 0 8px}
.rulesbody p:last-child{margin:0}
.rulesbody b{color:var(--ink)}
.multtag{display:inline-block;font-family:var(--disp);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  font-size:12px;border:1px solid var(--warn);color:var(--warn);background:rgba(255,192,67,.08);border-radius:4px;padding:1px 7px;margin-right:6px}
.tune select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font:inherit}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-soft)}
nav.tabs button{background:none;border:0;color:var(--muted);font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;
  font-size:14px;font-weight:600;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--go)}
.rulesbody h3{font-family:var(--disp);text-transform:uppercase;letter-spacing:.04em;font-size:16px;margin:22px 0 6px;color:var(--ink)}
.rulesbody h3:first-child{margin-top:6px}
.rulesbody .note{font-size:13px;color:var(--faint)}
.quip{font-style:italic;color:var(--faint)}
.rulestag{font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--go);
  border:1px solid var(--go-dim);border-radius:5px;padding:1px 7px;margin-left:8px;vertical-align:middle}
.rulestable{margin:8px 0;width:auto;max-width:420px;border-collapse:collapse}
.rulestable th{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--faint);text-align:left;font-weight:600;padding:0 16px 4px 0}
.rulestable td{border-bottom:1px solid var(--line-soft);padding:7px 16px 7px 0;font-size:14px}
.rulestable td.num,.rulestable th.num{font-family:var(--num);text-align:right;padding:7px 0 7px 22px;color:var(--ink)}
.rulestable th.num{padding:0 0 4px 22px;font-family:var(--disp);color:var(--faint)}
.ruleslist{margin:8px 0 4px;padding-left:22px;color:var(--muted);font-size:14.5px;line-height:1.6}
.ruleslist li{margin-bottom:6px}
.ruleslist b{color:var(--ink)}
.adminbox{padding:14px 16px 16px;display:grid;gap:12px}
.adminbox label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.adminbox select,.adminbox textarea,.rankin{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;font:inherit}
.adminbox select{padding:10px 12px}
.adminbox textarea{min-height:190px;padding:12px;font-family:var(--num);font-size:13px;line-height:1.55;resize:vertical;width:100%}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btn.small{flex:0 1 auto;padding:9px 14px;font-size:14px}
.adminrow{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line-soft)}
.adminside{padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.adminside + .adminside{border-left:1px solid var(--line-soft)}
.adminside .nm{font-family:var(--disp);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1;overflow-wrap:anywhere}
.adminside .raw{font-size:12px;color:var(--faint)}
.adminside .line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rankin{width:70px;padding:6px 8px;font-family:var(--num);font-size:13px}
.minibtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer}
.minibtn:hover{border-color:var(--go-dim);color:var(--go)}
.adminsum{padding:12px 16px;border-top:1px solid var(--line-soft);font-size:13.5px;color:var(--muted)}
.adminsum b{color:var(--ink)}
.empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;font-family:var(--disp);text-transform:uppercase;letter-spacing:.05em;font-size:17px;color:var(--ink);margin-bottom:4px}
.legend{padding:12px 16px;font-size:12px;color:var(--faint);border-top:1px solid var(--line-soft)}

/* Tally bar */
.tally{position:sticky;top:0;z-index:10;margin:16px 0 0;padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:rgba(16,26,44,.92);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.tally .lab{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--muted)}
.tally .big{font-family:var(--disp);font-weight:700;font-size:24px;line-height:1.05}
.tally .big span{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.tally .right{text-align:right}
.tally .sumnum{font-family:var(--num);font-weight:600;font-size:22px;color:var(--go);font-variant-numeric:tabular-nums}

/* Ties */
.ties{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:14px}
.tie{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.tie.done{border-color:var(--go-dim)}
.sides{display:grid;grid-template-columns:1fr 1fr}
.side{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;
  padding:14px 14px 12px;background:transparent;border:0;cursor:pointer;min-height:168px;
  -webkit-tap-highlight-color:transparent}
.side + .side{border-left:1px solid var(--line-soft)}
.side:hover:not([aria-disabled="true"]):not([aria-pressed="true"]){background:var(--panel-2)}
.side .team{font-family:var(--disp);font-weight:700;font-size:21px;letter-spacing:.02em;text-transform:uppercase;line-height:1.05;padding-right:52px}
.side .where{font-size:12.5px;color:var(--muted)}
.side .pts{margin-top:auto;font-family:var(--disp);font-weight:700;font-size:52px;line-height:.95;letter-spacing:-.005em;font-variant-numeric:tabular-nums}
.side .pts small{font-size:16px;font-weight:600;letter-spacing:.06em;margin-left:4px;text-transform:uppercase;color:var(--muted)}
.side .chance{font-family:var(--num);font-size:12px;color:var(--muted);margin-top:2px}
.side .usesrow{display:flex;align-items:center;gap:6px;margin-top:6px;font-family:var(--num);font-size:11.5px;color:var(--faint)}
.upips{display:inline-flex;gap:3px}
.upips i{display:block;width:4px;height:14px;border-radius:2px;background:var(--line)}
.upips i.on{background:var(--muted)}
.upips i.now{background:var(--warn)}
.upips i.full{background:var(--danger)}
.tag{display:inline-block;margin-top:6px;width:fit-content;font-family:var(--disp);font-size:10.5px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;border-radius:4px;padding:1px 6px;border:1px solid var(--line);color:var(--muted)}
.tag.long{border-color:var(--go-dim);color:var(--go);background:rgba(25,226,160,.08)}
.tag.cap{border-color:var(--warn);color:var(--warn);background:rgba(255,192,67,.08)}
.tag.out{border-color:var(--danger);color:var(--danger);background:rgba(255,91,126,.08)}

.tier-safe .pts{color:var(--ink)}
.tier-mid .pts{color:var(--warn)}
.tier-long .pts{color:var(--go);text-shadow:0 0 18px rgba(25,226,160,.35)}

.side[aria-pressed="true"]{background:rgba(25,226,160,.09);box-shadow:inset 0 0 0 2px var(--go)}
.side[aria-pressed="true"]::after{content:"Picked";position:absolute;top:12px;right:12px;
  font-family:var(--disp);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--go-dim);color:var(--go);background:rgba(25,226,160,.12);border-radius:4px;padding:1px 6px}
.side[aria-disabled="true"]{cursor:not-allowed}
.side.used-up{opacity:.5}
.side.used-up .team,.side.used-up .pts .num{text-decoration:line-through;text-decoration-thickness:2px}
.side.locked{cursor:default}

.strip{padding:8px 14px;font-size:13px;color:var(--warn);background:rgba(255,192,67,.07);border-bottom:1px solid var(--line-soft)}
.strip.stuck{color:var(--danger);background:rgba(255,91,126,.07)}

.why{border-top:1px solid var(--line-soft);font-size:13.5px;color:var(--muted)}
.why summary{padding:9px 14px;cursor:pointer;list-style:none;font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:12.5px}
.why summary::-webkit-details-marker{display:none}
.why summary::before{content:"+  ";color:var(--go)}
.why[open] summary::before{content:"\2212  "}
.why p{margin:0;padding:0 14px 12px}

/* Actions */
.actions{margin-top:16px;display:flex;gap:10px}
.btn{flex:1;padding:13px 16px;border-radius:10px;border:1px solid var(--go);background:var(--go);color:#032117;
  font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:16px;font-weight:700;cursor:pointer}
.btn.secondary{background:transparent;border-color:var(--line);color:var(--muted)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.msg{min-height:1.4em;margin-top:10px;font-size:13.5px;color:var(--muted)}

/* Tuning */
.tune{margin-top:22px}
.tune summary{padding:12px 16px;cursor:pointer;font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:14px;color:var(--muted);list-style:none}
.tune summary::-webkit-details-marker{display:none}
.tune .body{padding:4px 16px 16px;display:grid;gap:16px;font-size:14px}
.tune label{display:grid;gap:4px}
.tune input[type=range]{width:100%;accent-color:var(--go)}
.tune .hint{color:var(--faint);font-size:12.5px}
.tune b{font-family:var(--num);color:var(--ink)}
.footnote{text-align:center;color:var(--faint);font-size:12px;margin-top:18px}

@media (max-width:480px){
  .side .pts{font-size:46px}
  .side .team{font-size:19px}
}

.rounds{display:flex;gap:6px;overflow-x:auto;padding:14px 0 2px}
.rounds button{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;
  padding:6px 14px;font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:13px;font-weight:600;cursor:pointer}
.rounds button[aria-pressed="true"]{border-color:var(--go);color:var(--go);background:rgba(25,226,160,.08)}
.deadline{margin-top:14px;padding:10px 16px;border:1px solid var(--line-soft);border-radius:12px;background:var(--panel);font-size:14px;color:var(--muted);display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.deadline b{color:var(--ink)}
.deadline.locked b{color:var(--warn)}
.side.won{box-shadow:inset 0 0 0 2px var(--go-dim)}
.side.lost.picked{box-shadow:inset 0 0 0 2px var(--danger)}
.side.ro{cursor:default}
.res{margin-top:6px;font-family:var(--num);font-size:12.5px}
.res.ok{color:var(--go)} .res.no{color:var(--danger)} .res.wait{color:var(--faint)}
.autoline{padding:8px 14px;font-size:13px;color:var(--muted);border-top:1px solid var(--line-soft)}
.autoline b{color:var(--ink)}
.savestate{font-family:var(--num);font-size:12px;color:var(--faint);min-height:1.2em;text-align:right;margin-top:8px}
.demobanner{margin:12px 0 0;padding:8px 12px;border:1px dashed var(--warn);border-radius:10px;color:var(--warn);font-size:13px}
.lbtable{width:100%;border-collapse:collapse}
.lbtable th{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--faint);text-align:left;font-weight:600;padding:10px 12px}
.lbtable td{padding:10px 12px;border-top:1px solid var(--line-soft);font-size:14.5px}
.lbtable td.n,.lbtable th.n{text-align:right;font-family:var(--num)}
.lbtable tr.me td{background:rgba(25,226,160,.07)}
.lbtable td.pos{font-family:var(--num);color:var(--muted);width:34px}
.errorbox{margin-top:22px}
.sides{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.side{min-width:0}
/* Reserve a row for the "Picked" tag so long club names never run into it */
.side::before{content:"";display:block;height:18px;flex:0 0 auto}
.side[aria-pressed="true"]::after{right:auto;left:14px;top:12px}
.side .team{padding-right:0}

.adminbox input{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;font:inherit;padding:10px 12px;width:100%}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:inherit;font-size:13.5px;padding:6px 4px}
.linkbtn:hover{color:var(--go)}
#signOut{font-size:12.5px}

[hidden]{display:none !important}

/* Club crests: the image if we have one, otherwise a plain initials badge (an original shape, not a club mark) */
.cc{position:relative;flex:0 0 auto;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center}
.cc img{width:100%;height:100%;object-fit:contain;display:block}
.cc b{display:none;width:100%;height:100%;border-radius:50%;background:var(--raised);border:1px solid var(--line);color:var(--muted);
  font-family:var(--disp);font-size:12px;font-weight:700;letter-spacing:.04em;align-items:center;justify-content:center}
.cc.nocrest img{display:none}
.cc.nocrest b{display:flex}
.side .team{display:flex;align-items:center;gap:9px;padding-right:0}
.side .team .tn{min-width:0;overflow-wrap:anywhere}
.cc.sm{width:22px;height:22px}
.cc.sm b{font-size:9.5px}
.adminside .nm{display:flex;align-items:center;gap:8px}

.side .team .tn{overflow-wrap:break-word}
@media (max-width:480px){
  .side .team{gap:7px}
  .side .team .tn{font-size:17.5px}
  .cc{width:26px;height:26px}
  .cc b{font-size:11px}
}

/* team names scale with the screen so a long name like SUNDERLAND stays on one line beside its crest */
.side .team .tn{font-size:clamp(14px,4.3vw,21px)}
@media (max-width:400px){ .cc{width:24px;height:24px} .side .team{gap:6px} }

/* leaderboard with a column per round: scrolls sideways, rank and name stay put */
.lbwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.lbtable{min-width:100%}
.lbtable th,.lbtable td{white-space:nowrap}
.lbtable th.sticky,.lbtable td.sticky{position:sticky;background:var(--panel);z-index:1}
.lbtable .s1{left:0;min-width:38px;width:38px}
.lbtable .s2{left:38px;min-width:104px;box-shadow:1px 0 0 var(--line-soft)}
.lbtable tr.me td.sticky{background:color-mix(in srgb,var(--go) 8%,var(--panel))}
.lbtable td.total,.lbtable th.total{color:var(--ink);font-weight:600}
.lbtable td.top{color:var(--go);font-weight:600}
.lbtable small{display:block;color:var(--faint);font-family:var(--body);font-size:11px;font-weight:400;line-height:1.1}

.notebar{margin:14px 0 0;padding:10px 14px;border-radius:10px;font-size:14px;border:1px solid var(--go-dim);background:rgba(25,226,160,.08);color:var(--go)}
.notebar.bad{border-color:var(--danger);background:rgba(255,91,126,.08);color:var(--danger)}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.adminbox input[type=number],.adminbox input[type=datetime-local]{width:100%}
.rankin:disabled{opacity:.5}
.hint{font-size:12.5px;color:var(--muted)}
code{font-family:var(--num);font-size:12.5px;background:var(--panel-2);padding:2px 6px;border-radius:5px;word-break:break-all}
.adminside .raw,.rulestable .raw{font-size:12px;color:var(--faint)}
.rulestable td .rankin{width:74px}
.linkbtn{white-space:nowrap}
nav.tabs button{padding:10px 11px}
.rulestable th.pl,.rulestable td.pl{padding-left:18px}
/* on the results screen the highlighted team is the winner, not somebody's pick */
.side.resbtn[aria-pressed="true"]::after{content:"Won"}
.rulestable td.num{white-space:nowrap}

</style>
</head>
<body>
<header class="top">
  <div class="wrap mast" style="padding-left:16px;padding-right:16px">
    <svg class="crest" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <g class="crest-wind">
        <path d="M4 24 C14 20, 22 21, 30 23" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
        <path d="M2 33 C15 30, 25 31, 33 33" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.75"/>
        <path d="M6 42 C17 40, 25 39, 31 38" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.5"/>
      </g>
      <g transform="translate(42,32)">
        <circle r="15" fill="#f8fafc" stroke="#0b1626" stroke-width="2"/>
        <polygon points="0,-6.5 6,-2 4,5 -4,5 -6,-2" fill="#0b1626"/>
        <line x1="0" y1="-6.5" x2="0" y2="-13" stroke="#0b1626" stroke-width="1.8"/>
        <line x1="6" y1="-2" x2="13" y2="-4.5" stroke="#0b1626" stroke-width="1.8"/>
        <line x1="4" y1="5" x2="8" y2="12" stroke="#0b1626" stroke-width="1.8"/>
        <line x1="-4" y1="5" x2="-8" y2="12" stroke="#0b1626" stroke-width="1.8"/>
        <line x1="-6" y1="-2" x2="-13" y2="-4.5" stroke="#0b1626" stroke-width="1.8"/>
      </g>
    </svg>
    <div class="title">
      <h1><span class="k">Kamikaze</span> Football</h1>
      <div class="sub">FA Cup · Admin</div>
    </div>
    <div class="spacer"></div>
    <span class="chip" id="seasonChip" hidden><span class="dot"></span><span id="seasonText"></span></span>
    <button type="button" class="linkbtn" id="signOut" hidden>Sign out</button>
  </div>

  // Save a list of {name, short, rank} into the club list and show what changed.
  function saveEntries(entries, warnings, outId, ranges) {
    var updates = {}, fresh = 0, moved = 0, removed = [];

  /* --- Premier League and Championship straight from football-data.org, through the Worker --- */
  function demoStandings(code) {
    var feed = window.__admin.mock && window.__admin.mock.standingsData;
    if (feed && feed[code]) return Promise.resolve(feed[code]);
    var pl = ["Manchester City FC", "Arsenal FC", "Liverpool FC", "Chelsea FC", "Manchester United FC", "Aston Villa FC", "Tottenham Hotspur FC", "Sunderland AFC", "Newcastle United FC",
      "Brighton & Hove Albion FC", "Brentford FC", "Fulham FC", "Leeds United FC", "Everton FC", "Crystal Palace FC", "AFC Bournemouth", "West Ham United FC", "Nottingham Forest FC", "Wolverhampton Wanderers FC", "Burnley FC"];
    var elc = ["Ipswich Town FC", "Southampton FC", "Leicester City FC", "Birmingham City FC", "Wrexham AFC", "Charlton Athletic FC"];
    for (var i = elc.length; i < 24; i++) elc.push("Championship Club " + (i + 1) + " FC");
    var names = code === "PL" ? pl : elc;
    var table = names.map(function (n, i) {
      var hue = (n.charCodeAt(0) * 37 + n.length * 11) % 360;
      return { position: i + 1, team: { id: i, name: n, shortName: n.replace(/ FC$/, ""),
        crest: "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><path d="M6 4h28v20c0 8-8 12-14 14C14 36 6 32 6 24z" fill="hsl(' + hue + ',55%,45%)"/></svg>') } };
    });
    return new Promise(function (res, rej) {
      setTimeout(function () { if (window.__admin.mock && window.__admin.mock.standingsFail) rej(authError("HTTP")); else res({ standings: [{ type: "HOME", table: table.slice().reverse() }, { type: "TOTAL", table: table }] }); }, 40);
    });
  }
  function getStandings(code) {
    if (DEMO) return demoStandings(code);
    if (!CONFIG.STANDINGS_URL) return Promise.reject(authError("NO_URL"));
    return fetch(CONFIG.STANDINGS_URL.replace(/\/$/, "") + "/standings/" + code).then(function (r) {

  function saveNonLeague() {

  /* ---------------- Rounds tab ---------------- */

  function padId(i) { return "t" + (i < 9 ? "0" : "") + (i + 1); }

  /* --- draft: enter the draw, open the round --- */
  // Suggest a club only when exactly one known club contains every word that was typed, so
  // "Wycombe" finds Wycombe Wanderers but "Sheffield" (two clubs) or "Cambridge City" (a different club) find nothing.
  function tokenSuggest(name) {
    var want = norm(name).split(" "), fwd = [], back = [];
    Object.keys(registry()).forEach(function (k) {
      var have = norm(registry()[k].name).split(" ");
      if (want.every(function (w) { return have.indexOf(w) !== -1; })) fwd.push(registry()[k]);        // typed "Wycombe", saved "Wycombe Wanderers"
      else if (have.every(function (h) { return want.indexOf(h) !== -1; })) back.push(registry()[k]);  // typed "Solihull Moors", saved "Solihull"
    });
    return fwd.length === 1 ? fwd[0] : (!fwd.length && back.length === 1 ? back[0] : null);
  }
  function resolveClub(raw) {
    var name = raw.trim(), key = clubKey(name), c = registry()[key];
    if (c) return { raw: name, matched: true, key: key, club: c.name, short: c.short || c.name, rank: c.rank, crest: c.crest };
    var best = tokenSuggest(name);
    if (!best) {
      var n = CANON[norm(name)] || norm(name), bd = 99;
      Object.keys(registry()).forEach(function (k) { var d = lev(n, k.replace(/-/g, " ")); if (d < bd) { bd = d; best = registry()[k]; } });
      if (bd > 3) best = null;
    }
    return { raw: name, matched: false, key: key, club: name, short: name, rank: null, sug: best };
  }
  function parseDraw(text) {
    var ties = [], skipped = [];
    text.split(/\r?\n/).forEach(function (line) {
      var t = line.trim(); if (!t) return;
      t = t.replace(/^\d+\s*[.)\-:]\s*/, "").replace(/\s+\d{1,2}[:.]\d{2}\s*$/, "");
      var parts = t.split(/\s+(?:v|vs|vs\.)\s+/i);
      if (parts.length !== 2 || !parts[0].trim() || !parts[1].trim()) { skipped.push(line.trim()); return; }
      ties.push({ home: resolveClub(parts[0]), away: resolveClub(parts[1]) });
    });
    return { ties: ties, skipped: skipped };
  }
  function rankOk(sd) { return typeof sd.rank === "number" && sd.rank >= 1 && sd.rank <= 200; }
  // Things that look wrong about a draw: the number of ties, a club that lost last round, a winner left out.
  // pairs: [homeKey, awayKey, homeName, awayName]
  function winnersOf(rid) {
    var out = {}, ties = tiesOf(rid);
    Logic.tieIds(ties).forEach(function (t) {
      var x = ties[t]; if (!x.winner) return;
      var side = x[x.winner];
      out[side.key || clubKey(side.club || side.short)] = side.short || side.club;   // same identity the draw check uses, even for ties saved without a key
    });
    return out;
  }
  function drawProblems(rid, pairs) {
    var probs = [], def = roundDef(rid), n = pairs.length, idx = ROUND_DEFS.indexOf(def), prev = idx > 0 ? ROUND_DEFS[idx - 1] : null;
    if (def && n !== def.ties) probs.push(n + " tie" + (n === 1 ? "" : "s") + ", but " + def.name + " normally has " + def.ties + ".");
    var pr = prev && rounds()[prev.id];
    if (pr && pr.status === "resolved") {
      var winners = winnersOf(prev.id), inDraw = {}, out = [];
      pairs.forEach(function (p) { [0, 1].forEach(function (i) { inDraw[p[i]] = 1; if (!winners[p[i]]) out.push(p[2 + i]); }); });
      if (out.length) probs.push(out.join(", ") + (out.length === 1 ? " didn't" : " didn't") + " go through from " + prev.name + ".");
      var missing = Object.keys(winners).filter(function (k) { return !inDraw[k]; }).map(function (k) { return winners[k]; });
      if (missing.length) probs.push(missing.length + " " + prev.name + " winner" + (missing.length === 1 ? " is" : "s are") + " not in the draw: " + missing.join(", ") + ".");
    }

  }
  function drawPairs(ties) {

  }
  function drawDuplicates(ties) {

    return dups;
  }

  function draftHTML(rid, r) {

    var savedHTML = ids.length
      ? '<div class="panel" style="margin-top:16px"><div class="phead"><h2>Saved draw</h2><span class="hint">' + ids.length + ' ties</span></div><div style="max-height:260px;overflow:auto"><table class="rulestable" style="max-width:none;width:100%;margin:0"><tr><th style="padding-left:16px">Home</th><th>Away</th></tr>' +
        ids.map(function (t) { var x = saved[t]; return '<tr><td style="padding-left:16px">' + esc(x.home.short) + " <span class=\"raw\">" + rankLabel(x.home.rank) + "</span></td><td>" + esc(x.away.short) + ' <span class="raw">' + rankLabel(x.away.rank) + "</span></td></tr>"; }).join("") +
        '</table></div><div class="adminbox"><div class="btnrow"><button type="button" class="btn small secondary" id="dRefresh">Refresh positions from the tables</button><button type="button" class="btn small secondary" id="dClear">Clear the draw</button></div></div></div>' : "";
    var when = ids.length ? '<div class="panel" style="margin-top:16px"><div class="phead"><h2>Open the round</h2><span class="hint">' + esc(r.name) + " · ×" + r.mult + "</span></div>" +

  function sideHTML(sd, i, key) {

  // Clubs with no match and no likely suggestion: almost always genuine non-league sides.

  function renderDrawCheck() {

    var d = S.draw;
    box.innerHTML = '<div class="panel" style="margin-top:16px"><div class="phead"><h2>Check the ties</h2><span class="hint" id="dHint"></span></div>' +
      '<div class="adminbox" id="dNlBox" style="padding-bottom:4px"><div class="btnrow"><button type="button" class="btn small secondary" id="dNlAll"></button></div>' +
      '<p class="hint" style="margin:0">Clubs with no match and no suggestion are set to non-league (93), and remembered when you save the draw. A club with a suggestion is left for you to check, in case it is a typo.</p></div>' +
      d.ties.map(function (t, i) { return '<div class="adminrow">' + sideHTML(t.home, i, "home") + sideHTML(t.away, i, "away") + "</div>"; }).join("") +

      (d.skipped.length ? '<p class="msg">Skipped ' + d.skipped.length + " line" + (d.skipped.length === 1 ? "" : "s") + " with no \u201cv\u201d in them: " + esc(d.skipped.join("; ")) + "</p>" : "") +

  function updateDrawSummary() {
    var d = S.draw; if (!d || !$("dSum")) return;

    var dups = drawDuplicates(d.ties), def = roundDef(S.round), probs = drawProblems(S.round, drawPairs(d.ties));

    $("dSum").innerHTML = "<b>" + d.ties.length + "</b> ties read. " + (missing ? "<b>" + missing + "</b> still need a position." : "Every club has a position.") +
      (dups.length ? ' <span style="color:var(--danger)">' + esc(dups.join(", ")) + " appears more than once. A team can only be in one tie a round.</span>" : "") +
      (probs.length ? '<div class="strip stuck" style="margin:10px -16px 0">' + probs.map(function (p) { return "<div>" + esc(p) + "</div>"; }).join("") +

  function saveDraw() {

    });
    S.busy = true;
    multi(seasonPath(), updates).then(function () { S.draw = null; return loadSeason(); })
      .then(function () { renderAll(); note("Draw saved: " + Object.keys(ties).length + " ties." + (remembered ? " " + remembered + " non-league club" + (remembered === 1 ? "" : "s") + " remembered for next time." : ""), "ok"); })
      .catch(function (e) { note(errText(e), "bad"); }).then(function () { S.busy = false; });
  }
  function refreshRanks() {
    var rid = S.round, ties = tiesOf(rid), updates = {}, n = 0;
    Logic.tieIds(ties).forEach(function (tid) {
      ["home", "away"].forEach(function (k) {
        var c = registry()[clubKey(ties[tid][k].club)];
        if (c && c.rank !== ties[tid][k].rank) { updates["ties/" + rid + "/" + tid + "/" + k + "/rank"] = c.rank; n++; }
      });
    });
    if (!n) return note("Every position is already up to date.", "ok");
    multi(seasonPath(), updates).then(loadSeason).then(function () { renderRounds(); note(n + " position" + (n === 1 ? "" : "s") + " updated.", "ok"); })
      .catch(function (e) { note(errText(e), "bad"); });
  }
  function clearDraw() {
    if (!confirm("Clear the saved draw for this round?")) return;
    db.remove(seasonPath() + "/ties/" + S.round).then(loadSeason).then(function () { renderRounds(); note("Draw cleared.", "ok"); }).catch(function (e) { note(errText(e), "bad"); });
  }

  function openRound() {
    var rid = S.round, r = rounds()[rid], ties = tiesOf(rid), ids = Logic.tieIds(ties), when = $("oWhen").value;
    if (!ids.length) return note("Save a draw first.", "bad");
    if (!when) return note("Choose when picks lock.", "bad");
    var locksAt = new Date(when).getTime();
    if (!(locksAt > Date.now())) return note("The lock time needs to be in the future.", "bad");
    var missing = ids.some(function (t) { return !rankOk(ties[t].home) || !rankOk(ties[t].away); });
    if (missing) return note("Some clubs have no position. Re-enter the draw.", "bad");
    var probs = drawProblems(rid, ids.map(function (t) { var x = ties[t]; return [x.home.key || clubKey(x.home.club), x.away.key || clubKey(x.away.club), x.home.short, x.away.short]; }));
    if (!confirm((probs.length ? "Check before you open:\n\n" + probs.join("\n") + "\n\n" : "") + "Open " + r.name + " with " + ids.length + " ties, locking " + fmtWhen(locksAt) + "? Players will be able to see the ties and pick.")) return;
    var c = cfg(), updates = {};
    ids.forEach(function (t) {
      var x = ties[t]; x.home.key = x.home.key || clubKey(x.home.club); x.away.key = x.away.key || clubKey(x.away.club);
      updates["ties/" + rid + "/" + t] = Logic.freezeTie(x, c, r.mult);
    });
    updates["rounds/" + rid + "/locksAt"] = locksAt;
    updates["rounds/" + rid + "/status"] = "open";
    S.busy = true;
    multi(seasonPath(), updates).then(loadSeason).then(function () { renderAll(); note(r.name + " is open. Picks lock " + fmtWhen(locksAt) + ".", "ok"); })
      .catch(function (e) { note(errText(e), "bad"); }).then(function () { S.busy = false; });
  }

  /* --- open: progress, extend, lock --- */
  // Where a manager stands in a round: picks made, ties they could pick, and ties they are locked out of
  // (both teams already used up for them, so nothing can be picked there).
  function pickState(uid, rid) {
    var ties = tiesOf(rid), ids = Logic.tieIds(ties), mine = picksOf(rid)[uid] || {}, used = Logic.usedBefore(S.season, uid, rid), mx = cfg().maxUses;
    var made = 0, pickable = 0, dead = [];
    ids.forEach(function (t) {
      var x = ties[t], hOk = (used[Logic.clubOf(x, "home")] || 0) < mx, aOk = (used[Logic.clubOf(x, "away")] || 0) < mx;
      if (!hOk && !aOk) { dead.push(x.home.short + " v " + x.away.short); return; }
      pickable++; if (Logic.validSide(mine[t])) made++;
    });
    var status = pickable === 0 ? "locked out" : made === pickable ? "done" : made === 0 ? "none yet" : "partly";
    return { made: made, pickable: pickable, dead: dead, total: ids.length, status: status };
  }

  function openHTML(rid, r) {
    var ties = tiesOf(rid), ids = Logic.tieIds(ties), picks = picksOf(rid), mgrs = managerList();
    var anyDead = false;
    var rows = mgrs.map(function (m) {
      var st = pickState(m.uid, rid); if (st.dead.length) anyDead = true;
      return "<tr><td>" + esc(m.name) + (st.dead.length ? '<small class="raw" style="display:block;font-family:var(--body)">Locked out of: ' + esc(st.dead.join(", ")) + "</small>" : "") + '</td><td class="num">' + st.made + " of " + st.pickable +
        (st.dead.length ? '<small class="raw" style="display:block;font-family:var(--body)">' + st.dead.length + " locked out</small>" : "") + '</td><td class="num">' + st.status + "</td></tr>";
    }).join("");
    var overdue = Date.now() >= r.locksAt;
    return '<div class="panel" style="margin-top:14px"><div class="phead"><h2>' + esc(r.name) + ' is open</h2><span class="hint">Locks ' + esc(fmtWhen(r.locksAt)) + (overdue ? " (time's up)" : "") + "</span></div>" +
      '<div class="adminbox">' + (mgrs.length ? '<table class="rulestable" style="max-width:none;width:100%"><tr><th>Manager</th><th class="num">Picks</th><th class="num">Status</th></tr>' + rows + "</table>" : '<p class="hint" style="margin:0">Nobody has joined yet.</p>') +
      '<p class="hint" style="margin:0">Picks are counted out of the ties each manager can actually pick. \u201cLocked out\u201d means both teams in a tie are already used up for them, so nothing can be picked there and it scores 0. Anything else left blank is filled in when you lock: the higher-ranked team, or the other if that one is used up.</p>' +
      '<div class="btnrow"><button type="button" class="btn small" id="oRefresh">Refresh</button><button type="button" class="btn small" id="oLock">Lock ' + esc(r.name) + "</button></div>" +
      '<label><span>Change the lock time</span><input id="oExtend" type="datetime-local"></label><div class="btnrow"><button type="button" class="btn small secondary" id="oExtendGo">Save new lock time</button></div>' +
      "</div></div>";
  }
  function extendLock() {
    var when = $("oExtend").value; if (!when) return note("Choose a new lock time.", "bad");
    var t = new Date(when).getTime(); if (!(t > Date.now())) return note("The new time needs to be in the future.", "bad");
    db.put(seasonPath() + "/rounds/" + S.round + "/locksAt", t).then(loadSeason).then(function () { renderRounds(); note("Lock time changed to " + fmtWhen(t) + ".", "ok"); }).catch(function (e) { note(errText(e), "bad"); });
  }

  function lockRound() {
    var rid = S.round, r = rounds()[rid];
    if (!confirm("Lock " + r.name + " now? Players won't be able to change their picks, and any blank ties will be filled in.")) return;
    S.busy = true;
    db.put(seasonPath() + "/rounds/" + rid + "/status", "locked").then(function () { return runLockStep(rid); })
      .then(function () { renderAll(); note(r.name + " is locked. " + S.lockReport.filled + " blanks filled" + (S.lockReport.overridden ? ", " + S.lockReport.overridden + " picks replaced" : "") + ".", "ok"); })
      .catch(function (e) { note(errText(e) + " The round is locked, but the lock step didn't finish. Use Run the lock step again.", "bad"); loadSeason().then(renderAll); })
      .then(function () { S.busy = false; });
  }
  // Locked first, so nobody can change a pick while this runs. Safe to run again.
  function runLockStep(rid) {
    return loadSeason().then(function () { return db.get(seasonPath() + "/picks/" + rid); }).then(function (fresh) {
      var picksNow = fresh || {}, plan = Logic.planLock(S.season, rid, picksNow);
      S.lockReport = plan.report;
      return multi(seasonPath(), plan.updates).then(function () {
        var merged = Logic.mergedPicks(S.season, rid, picksNow, plan.updates), pub = {}, ties = tiesOf(rid), tieNames = {};
        Logic.tieIds(ties).forEach(function (t) { tieNames[t] = { home: ties[t].home.short, away: ties[t].away.short }; });
        Object.keys(merged).forEach(function (uid) {
          var m = managers()[uid]; if (!m) return;
          pub[m.name] = {}; Object.keys(merged[uid]).forEach(function (t) { pub[m.name][t] = merged[uid][t].side; });
        });
        return db.put("kamikaze_fa_public/seasons/" + S.sid + "/rounds/" + rid, { name: rounds()[rid].name, ties: tieNames, picks: pub });
      }).then(function () {
        var u = {}; u["rounds/" + rid + "/filled"] = true; u["rounds/" + rid + "/lockedAt"] = Date.now();
        return multi(seasonPath(), u);
      }).then(loadSeason);
    });
  }

  /* --- locked / finished: results --- */
  function resultsHTML(rid, r) {
    var ties = tiesOf(rid), ids = Logic.tieIds(ties), done = ids.filter(function (t) { return ties[t].winner; }).length;
    var warn = r.status === "locked" && !r.filled ? '<div class="strip stuck">The lock step didn\'t finish for this round. <button type="button" class="minibtn" id="rLockAgain">Run the lock step</button></div>' : "";
    var rep = S.lockReport && r.status === "locked" ? '<div class="strip">Lock step: ' + S.lockReport.filled + " blanks filled, " + S.lockReport.overridden + " over-limit picks replaced, " + S.lockReport.none + " ties with no pick possible.</div>" : "";
    var rows = ids.map(function (t) {
      var x = ties[t];
      function btn(side) {
        var w = x.winner === side;
        return '<button type="button" class="side ro resbtn' + (w ? " won picked" : "") + '" style="min-height:0;padding:12px 14px" data-act="win" data-t="' + t + '" data-side="' + side + '" aria-pressed="' + w + '"><span class="team">' + crestHTML(x[side], true) + '<span class="tn">' + esc(x[side].short) + '</span></span><span class="where">' + rankLabel(x[side].rank) + "</span></button>";
      }
      return '<div class="adminrow">' + btn("home") + btn("away") + "</div>";
    }).join("");
    return '<div class="panel" style="margin-top:14px"><div class="phead"><h2>' + esc(r.name) + " results</h2><span class=\"hint\">" + done + " of " + ids.length + " marked" + (r.status === "resolved" ? " · finished" : "") + "</span></div>" + warn + rep +
      '<p class="hint" style="padding:12px 16px 0;margin:0">Tap the team that went through. Extra time and penalties count. Tap again to clear.</p>' + '<div style="margin-top:8px">' + rows + "</div>" +
      '<div class="adminbox"><div class="btnrow"><button type="button" class="btn small" id="rSave">Save results</button>' +
      (r.status === "locked" ? '<button type="button" class="btn small" id="rResolve"' + (done < ids.length ? " disabled" : "") + ">Mark round finished</button>" : '<button type="button" class="btn small secondary" id="rRecalc">Save and recalculate the table</button>') +
      "</div></div></div>";
  }
  var pendingWinners = {};
  function toggleWinner(t, side) {
    var ties = tiesOf(S.round), cur = (t in pendingWinners) ? pendingWinners[t] : (ties[t].winner || null);
    pendingWinners[t] = cur === side ? null : side;
    var x = ties[t]; x.winner = pendingWinners[t] || undefined; if (!x.winner) delete x.winner;   // shown straight away, saved on Save
    renderRounds();
  }
  function saveResults(thenResolve) {
    var rid = S.round, ties = tiesOf(rid), updates = {};
    Logic.tieIds(ties).forEach(function (t) { if (t in pendingWinners) updates["ties/" + rid + "/" + t + "/winner"] = pendingWinners[t]; });
    var r = rounds()[rid];
    if (thenResolve) {
      var allDone = Logic.tieIds(ties).every(function (t) { return ties[t].winner; });
      if (!allDone) return note("Mark every tie first.", "bad");
      updates["rounds/" + rid + "/status"] = "resolved";
    }
    S.busy = true;
    multi(seasonPath(), updates).then(function () { pendingWinners = {}; return loadSeason(); }).then(function () {
      var needTable = thenResolve || r.status === "resolved";
      return needTable ? publishLeaderboard() : null;
    }).then(function () { renderAll(); note(thenResolve ? r.name + " finished and the table is updated." : "Results saved.", "ok"); })
      .catch(function (e) { note(errText(e), "bad"); loadSeason().then(renderAll); }).then(function () { S.busy = false; });
  }
  function publishLeaderboard() {
    return db.put("kamikaze_fa_public/seasons/" + S.sid + "/leaderboard", Logic.leaderboard(S.season));
  }

  $("roundsView").addEventListener("click", function (e) {
    var t = e.target, pill = t.closest("#roundPills [data-rid]");
    if (pill) { S.round = pill.getAttribute("data-rid"); pendingWinners = {}; loadSeason().then(renderRounds); return; }
    var w = t.closest("[data-act=win]");
    if (w) { toggleWinner(w.getAttribute("data-t"), w.getAttribute("data-side")); return; }
    var id = t.id;
    if (id === "dRead") {
      var out = parseDraw($("dText").value); S.draw = { round: S.round, ties: out.ties, skipped: out.skipped }; S.drawForce = false; renderDrawCheck(); return;
    }
    if (id === "dNlAll") {
      S.draw.ties.forEach(function (t) { ["home", "away"].forEach(function (k) { var sd = t[k]; if (!sd.matched && sd.rank === null && !sd.sug) { sd.rank = NONLEAGUE_RANK; sd.manual = true; } }); });
      renderDrawCheck(); return;
    }
    if (id === "dSave") return saveDraw();
    if (id === "dRefresh") return refreshRanks();
    if (id === "dClear") return clearDraw();
    if (id === "oGo") return openRound();
    if (id === "oRefresh") return loadSeason().then(renderRounds);
    if (id === "oLock") return lockRound();
    if (id === "oExtendGo") return extendLock();
    if (id === "rLockAgain") { S.busy = true; return runLockStep(S.round).then(function () { renderAll(); note("Lock step finished.", "ok"); }).catch(function (er) { note(errText(er), "bad"); }).then(function () { S.busy = false; }); }
    if (id === "rSave") return saveResults(false);
    if (id === "rResolve") return saveResults(true);
    if (id === "rRecalc") return saveResults(false);
    var act = t.getAttribute && t.getAttribute("data-act");
    if (act && S.draw) {
      var i = parseInt(t.getAttribute("data-i"), 10), k = t.getAttribute("data-k"), sd = S.draw.ties[i][k];
      if (act === "use" && sd.sug) S.draw.ties[i][k] = { raw: sd.raw, matched: true, key: clubKey(sd.sug.name), club: sd.sug.name, short: sd.sug.short || sd.sug.name, rank: sd.sug.rank, crest: sd.sug.crest };
      if (act === "nl") { sd.rank = 93; sd.manual = true; }
      renderDrawCheck();
    }
  });
  $("roundsView").addEventListener("change", function (e) { if (e.target.id === "dForce") { S.drawForce = e.target.checked; updateDrawSummary(); } });
  $("roundsView").addEventListener("input", function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains("rankin") && S.draw) {
      var side = S.draw.ties[parseInt(t.getAttribute("data-i"), 10)][t.getAttribute("data-k")];
      side.rank = t.value === "" ? null : Number(t.value); side.manual = true; updateDrawSummary();
    }
  });

  /* ---------------- leaderboard table (one column per finished round) ---------------- */
  var LB_LABEL = { r3: "R3", r4: "R4", r5: "R5", qf: "QF", sf: "SF", f: "Final" };
  function fmt1(x) { return Number(x).toFixed(1); }
  function lbTableHTML(rows) {
    var ids = ROUND_DEFS.map(function (d) { return d.id; }).filter(function (id) { return rows.some(function (r) { return r.rounds && r.rounds[id] !== undefined; }); });
    var top = {}; ids.forEach(function (id) { top[id] = Math.max.apply(null, rows.map(function (r) { return (r.rounds && r.rounds[id]) || 0; })); });
    return '<div class="lbwrap"><table class="lbtable"><tr><th class="sticky s1">#</th><th class="sticky s2">Manager</th><th class="n total">Total</th>' +
      ids.map(function (id) { return '<th class="n">' + LB_LABEL[id] + "</th>"; }).join("") + '<th class="n">Correct</th><th class="n">Biggest gap</th></tr>' +
      rows.map(function (r, i) {
        return '<tr><td class="pos sticky s1">' + (i + 1) + '</td><td class="sticky s2">' + esc(r.name) + '</td><td class="n total">' + fmt1(r.points) + "</td>" +
          ids.map(function (id) { var v = (r.rounds && r.rounds[id]) || 0; return '<td class="n' + (v > 0 && v === top[id] ? " top" : "") + '">' + (v ? fmt1(v) : "0") + "</td>"; }).join("") +
          '<td class="n">' + r.correct + '</td><td class="n">' + (r.bestGap ? r.bestGap + "<small>" + esc(r.bestGapClub || "") + "</small>" : "-") + "</td></tr>";
      }).join("") + "</table></div>";
  }

  /* ---------------- Players tab ---------------- */
  function renderPlayers() {
    if (!S.sid) return needSeason("playersView");
    var mgrs = managerList(), openId = Object.keys(rounds()).filter(function (id) { return rounds()[id].status === "open"; })[0];
    var rows = mgrs.map(function (m) {
      var prog = "";
      if (openId) { var st = pickState(m.uid, openId); prog = st.made + " of " + st.pickable + (st.dead.length ? " (" + st.dead.length + " locked out)" : ""); }
      return "<tr><td>" + esc(m.name) + '</td><td class="num">' + esc(prog) + '</td><td class="num"><button type="button" class="minibtn" data-rm="' + esc(m.uid) + '">Remove</button></td></tr>';
    }).join("");
    var lb = Logic.leaderboard(S.season);
    $("playersView").innerHTML =
      '<div class="panel" style="margin-top:18px"><div class="phead"><h2>Managers</h2><span class="hint">Join code: <b>' + esc(S.season.joinCode || "") + "</b></span></div>" +
      '<div class="adminbox">' + (mgrs.length ? '<table class="rulestable" style="max-width:none;width:100%"><tr><th>Name</th><th class="num">' + (openId ? esc(rounds()[openId].name) + " picks" : "") + '</th><th class="num"></th></tr>' + rows + "</table>" : '<p class="hint" style="margin:0">Nobody has joined yet. Share the join code and the address of the player page.</p>') +
      '<p class="hint" style="margin:0">Removing a manager frees their name so they can join again. It doesn\'t delete their picks.</p></div></div>' +
      '<div class="panel" style="margin-top:16px"><div class="phead"><h2>The table</h2><span class="hint">Finished rounds only</span></div>' +
      (lb.length ? lbTableHTML(lb) : '<div class="empty"><b>Nothing yet</b>Scores appear once a round is finished.</div>') +
      '<div class="adminbox"><div class="btnrow"><button type="button" class="btn small secondary" id="pRecalc">Recalculate and publish the table</button></div></div></div>';
  }
  $("playersView").addEventListener("click", function (e) {
    var t = e.target;
    if (t.id === "pRecalc") {
      publishLeaderboard().then(function () { note("The table has been recalculated and published.", "ok"); }).catch(function (er) { note(errText(er), "bad"); });
      return;
    }
    var rm = t.getAttribute && t.getAttribute("data-rm");
    if (rm) {
      var m = managers()[rm];
      if (!confirm("Remove " + m.name + "? Their name becomes free so they can join again. Their picks are kept.")) return;
      var u = {}; u["managers/" + rm] = null; u["names/" + m.name.toLowerCase()] = null;
      multi(seasonPath(), u).then(loadSeason).then(function () { renderAll(); note(m.name + " removed.", "ok"); }).catch(function (er) { note(errText(er), "bad"); });
    }
  });

  /* ---------------- start ---------------- */
  if (DEMO) $("banner").innerHTML = '<div class="demobanner">Demo data. Sign in with <b>admin@example.com</b> / <b>admin1234</b>. Nothing here touches your real database.</div>';
  db = DEMO ? new MockDb(buildDemoSeed()) : new RestDb(CONFIG.DB_URL);
  if (DEMO) window.__admin.mock = { db: db, auth: Authn };
  boot();
})();
</script>
</body>
</html>
